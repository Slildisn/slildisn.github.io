<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="author" content="CYRENE_Original">
<title>母鸡大战公鸡</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #fff8ec 0%, #ffefd5 55%, #d8f3e3 100%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --band-top: 56px;
    --band-bottom: 100px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* 顶部信息栏：独立绝对层，不参与画布布局 */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--band-top);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 0 12px;
    z-index: 6;
    background: linear-gradient(180deg, #fff8ec 0%, #fff2dc 100%);
    border-bottom: 1px solid rgba(255, 224, 168, 0.9);
    box-shadow: 0 6px 16px -14px rgba(122, 86, 44, 0.7);
  }
  .hud-title {
    margin: 0; font-size: clamp(16px, 2.6vw, 26px); line-height: 1.1;
    color: #5c4326; letter-spacing: 0.04em; font-weight: 800;
    white-space: nowrap;
    text-shadow: 0 2px 0 #ffffff, 0 8px 16px rgba(196, 142, 63, 0.18);
  }
  .hud-mid { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
  .hud-prep { font-size: 14px; font-weight: 700; color: #b35a1f; white-space: nowrap; }
  .hud-prep[hidden] { display: none; }
  .hud-corn { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .corn-dot {
    width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 34% 32%, #fff3c4, #ffcf5c 55%, #e8a92c 100%);
    box-shadow: 0 2px 6px -2px rgba(154, 111, 42, 0.7);
  }
  .corn-label { font-size: 13px; color: #7b6650; }
  #corn-val { font-size: 22px; color: #c9842a; line-height: 1; display: inline-block; }
  #corn-val.pulse { animation: cornPop 0.3s ease; }
  @keyframes cornPop { 0% { transform: scale(1); } 45% { transform: scale(1.22); } 100% { transform: scale(1); } }

  /* 底部卡牌栏：独立绝对层 + 底部安全区 */
  #card-dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(var(--band-bottom) + var(--safe-bottom));
    padding: 8px 10px calc(8px + var(--safe-bottom));
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
    background: linear-gradient(180deg, #fff8ec 0%, #fff6e2 45%, #ffefd5 100%);
    border-top: 1px solid rgba(255, 224, 168, 0.9);
    box-shadow: 0 -10px 20px -18px rgba(122, 86, 44, 0.9);
  }

  /* 开局选牌页（PVZ 式卡组） */
  #deck-screen {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    background:
      radial-gradient(900px 520px at 20% -10%, rgba(255, 219, 138, 0.55), transparent 65%),
      linear-gradient(180deg, #fff8ec 0%, #ffefd5 60%, #d8f3e3 100%);
  }
  #deck-screen[hidden] { display: none; }
  .deck-panel {
    width: min(760px, 100%); height: min(92vh, 100%);
    display: flex; flex-direction: column;
    background: rgba(255, 253, 248, 0.96);
    border: 2px solid #ffe0a8; border-radius: 22px;
    box-shadow: 0 18px 40px -24px rgba(122, 86, 44, 0.8);
    padding: 12px 12px 10px;
  }
  .deck-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 4px 8px;
  }
  .deck-title { font-size: 18px; font-weight: 800; color: #5c4326; }
  .deck-count { font-size: 15px; font-weight: 700; color: #c9842a; }
  .deck-grid {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px; overflow-y: auto; padding: 4px 2px 10px;
    -webkit-overflow-scrolling: touch;
  }
  .deck-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 6px 4px; min-height: 76px;
    border-radius: 16px; border: 2px solid #ffe0a8;
    background: linear-gradient(180deg, #fffdf8, #fff6e2);
    color: #5c4326; font-family: inherit; text-align: center;
    box-shadow: 0 8px 16px -12px rgba(92, 67, 38, 0.9), inset 0 1px 0 #fff;
    transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .deck-card .dc-ico {
    width: 26px; height: 26px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 2px 6px -3px rgba(0, 0, 0, 0.35);
  }
  .deck-card .dc-name { font-size: 12px; font-weight: 700; line-height: 1.2; }
  .deck-card .dc-cost { font-size: 10.5px; color: #c9842a; }
  .deck-card.sel {
    border-color: #ffb63c;
    background: linear-gradient(180deg, #fff3cf, #ffd98a);
    box-shadow: 0 0 0 4px rgba(255, 207, 92, 0.35), 0 10px 20px -12px rgba(154, 111, 42, 0.8);
    transform: translateY(-2px);
  }
  .deck-card.lock {
    opacity: 0.42; filter: grayscale(0.9);
  }
  .deck-card.lock .dc-cost { color: #6b5a44; }
  .deck-actions {
    display: flex; gap: 10px; justify-content: center;
    padding: 8px 2px calc(2px + env(safe-area-inset-bottom, 0px));
  }
  .deck-btn {
    min-height: 46px; padding: 0 22px; border-radius: 999px;
    border: 2px solid #ffe0a8; background: #fffdf8;
    color: #6b4a22; font-family: inherit; font-size: 15px; font-weight: 700;
  }
  .deck-btn.primary {
    border-color: #ffb63c;
    background: linear-gradient(180deg, #ffe9a8, #ffc94d);
    color: #5c4326;
    box-shadow: 0 10px 22px -12px rgba(180, 120, 30, 0.9);
  }
  .deck-btn:disabled { opacity: 0.45; filter: saturate(0.6); }

  /* 右下角玩法工具：铲子 / 倍速（不遮挡卡牌） */
  #play-tools {
    position: fixed; right: 10px;
    bottom: calc(var(--band-bottom) + var(--safe-bottom) + 10px);
    z-index: 7;
    display: flex; flex-direction: column; gap: 8px;
  }
  .tool-btn {
    width: 46px; height: 46px; border-radius: 14px;
    border: 2px solid #ffcf5c;
    background: linear-gradient(180deg, #fffdf6 0%, #ffe9b8 100%);
    color: #8a5a2b; font-family: inherit;
    font-size: 15px; font-weight: 800; line-height: 1;
    box-shadow: 0 8px 18px -8px rgba(154, 111, 42, 0.55), inset 0 1px 0 #ffffff;
    transition: transform 0.18s ease, box-shadow 0.22s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tool-btn:active { transform: translateY(1px) scale(0.97); }
  .tool-btn.sel {
    border-color: #ff9f43;
    background: linear-gradient(180deg, #fff3cf 0%, #ffd98a 100%);
    box-shadow: 0 0 0 4px rgba(255, 207, 92, 0.35), 0 10px 20px -10px rgba(154, 111, 42, 0.7);
    transform: translateY(-2px);
  }

  /* 中间战场：固定在两条栏之间，画布等比填充，不被栏内容挤压 */
  #game {
    position: fixed; left: 0; right: 0;
    top: var(--band-top);
    bottom: calc(var(--band-bottom) + var(--safe-bottom));
    z-index: 1;
  }

  .card-bar {
    display: flex;
    gap: 10px;
    width: 100%;
    padding: 2px 12px 4px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    scrollbar-width: none;
    scroll-snap-type: x proximity;
  }
  .card-bar::-webkit-scrollbar { display: none; }

  /* 横屏：单行卡槽 + 高度收窄 */
  @media (orientation: landscape) {
    :root { --band-bottom: 84px; }
    .card {
      flex: 0 0 88px; width: 88px; height: 62px; padding: 3px 4px;
    }
    .card .card-ico { width: 20px; height: 20px; }
    .card-txt b { font-size: 10.5px; }
    .card-txt i { font-size: 9px; }
    #play-tools { bottom: calc(var(--band-bottom) + var(--safe-bottom) + 8px); }
    #play-tools .tool-btn { width: 40px; height: 40px; font-size: 13px; }
  }
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; text-align: center;
    flex: 0 0 104px; width: 104px; height: 74px; padding: 4px 4px; overflow: hidden;
    scroll-snap-align: start;
    border-radius: 18px; border: 2px solid #ffe0a8;
    background: linear-gradient(180deg, #fffdf8, #fff6e2);
    color: #5c4326; font-family: inherit;
    box-shadow: 0 10px 18px -12px rgba(92, 67, 38, 0.9), 0 3px 8px -5px rgba(92, 67, 38, 0.25), inset 0 1px 0 #ffffff;
    transition: transform 0.18s ease, box-shadow 0.22s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card { position: relative; }
  .card:active { transform: translateY(1px) scale(0.985); }

  /* PVZ 式卡槽冷却：遮罩从下往上退去 */
  .card-mask {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(180deg, rgba(92, 67, 38, 0.30), rgba(92, 67, 38, 0.46));
    pointer-events: none; z-index: 2;
    border-radius: 0 0 16px 16px;
  }
  .card-cd {
    position: absolute; left: 0; right: 0; bottom: 5px;
    text-align: center; font-size: 10.5px; font-weight: 700;
    color: #4a3a2a; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
    pointer-events: none; z-index: 3; display: none;
  }
  .card.cooling { filter: saturate(0.35) brightness(0.94); }
  .card.cooling .card-cd { display: block; }
  .card.cooling .card-txt, .card.cooling .card-ico { opacity: 0.55; }
  .card.locked { pointer-events: none; }
  .card.glow { animation: cardReady 0.46s ease; }
  @keyframes cardReady {
    0%   { box-shadow: 0 0 0 0 rgba(255, 207, 92, 0); }
    45%  { box-shadow: 0 0 0 4px rgba(255, 207, 92, 0.45), 0 0 18px rgba(255, 207, 92, 0.55); }
    100% { box-shadow: 0 0 0 0 rgba(255, 207, 92, 0); }
  }
  .card.sel {
    border-color: #ffb63c;
    background: linear-gradient(180deg, #fff7de, #ffedc4);
    box-shadow: 0 0 0 4px rgba(255, 207, 92, 0.26), 0 12px 22px -12px rgba(154, 111, 42, 0.9), inset 0 1px 0 #ffffff;
    transform: translateY(-2px);
  }
  .card.off { opacity: 0.55; filter: saturate(0.7); }
  .card.wave-lock { opacity: 0.45; filter: grayscale(0.85); }
  .card.wave-lock .card-cd {
    display: block; font-size: 9px; color: #6b5a44;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  .card-ico, .dc-ico { background-clip: padding-box; }
  .shape-round { border-radius: 8px; }
  .shape-circle { border-radius: 50%; }
  .shape-ellipse { border-radius: 50%; transform: scaleY(0.76); }
  .shape-square { border-radius: 2px; }
  .shape-capsule { border-radius: 50% / 34%; }
  .shape-diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .shape-shuttle { clip-path: polygon(50% 0, 92% 50%, 50% 100%, 8% 50%); }
  .shape-hexa { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .shape-teardrop { border-radius: 50% 50% 50% 10%; }
  .shape-blob { border-radius: 62% 38% 55% 45%; }
  .shape-star { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .shape-fan { border-radius: 50% 50% 6% 6%; }

  .card-ico {
    flex: 0 0 auto; width: 22px; height: 22px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 2px 6px -3px rgba(0, 0, 0, 0.35);
  }
  .card-txt {
    display: flex; flex-direction: column; align-items: center;
    gap: 1px; width: 100%; min-width: 0; overflow: hidden;
  }
  .card-txt b {
    font-size: 12px; line-height: 1.08; font-weight: 700;
    white-space: normal; word-break: break-all;
    overflow: hidden; text-overflow: clip;
  }
  .card-txt i {
    font-style: normal; font-size: 10px; line-height: 1.08; color: #c9842a;
    white-space: normal;
    overflow: hidden; text-overflow: clip;
  }
  @media (max-width: 380px) {
    .card-txt b { font-size: 11px; }
    .card-txt i { font-size: 9px; }
  }
    canvas { display: block; }

  /* 自毁处决层 */
  #egg-fatal {
    position: fixed; inset: 0; z-index: 2147483000;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 24px; text-align: center;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  #egg-fatal .q {
    font-size: min(42vw, 240px); line-height: 1;
    animation: eggBlink 0.42s steps(2, end) infinite;
  }
  #egg-fatal .t {
    color: #ff2d55; font-size: clamp(14px, 4vw, 22px);
    font-weight: 700; letter-spacing: 0.06em; line-height: 1.6;
  }
  #egg-fatal .s {
    color: #cfc7e0; font-size: clamp(11px, 3vw, 15px);
    line-height: 1.6; word-break: break-all;
  }
  @keyframes eggBlink { 50% { color: #ffffff; transform: scale(0.96); } }

  #boot-msg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #8a7256;
    font: 16px/1.7 "Noto Sans SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
    white-space: pre-line;
  }

</style>
</head>
<body>

<div id="hud">
  <h1 class="hud-title">母鸡大战公鸡</h1>
  <div class="hud-mid">
    <div class="hud-prep" id="prep-line" hidden>安全准备 15s</div>
  </div>
  <div class="hud-corn">
    <span class="corn-dot"></span>
    <span class="corn-label">玉米粒</span>
    <b id="corn-val">50</b>
  </div>
</div>

<div id="game"></div>

<div id="card-dock">
  <div class="card-bar" id="card-bar"></div>
</div>

<div id="deck-screen" hidden>
  <div class="deck-panel">
    <div class="deck-head">
      <span class="deck-title">选择本局卡组</span>
      <span class="deck-count" id="deck-count">已选 0 / 10</span>
    </div>
    <div class="deck-grid" id="deck-grid"></div>
    <div class="deck-actions">
      <button class="deck-btn" type="button" id="deck-clear">清空重选</button>
      <button class="deck-btn primary" type="button" id="deck-start" disabled>开始战斗</button>
    </div>
  </div>
</div>

<div id="play-tools">
  <button id="speed-btn" class="tool-btn" type="button" aria-label="切换倍速">1×</button>
  <button id="shovel-btn" class="tool-btn" type="button" aria-label="铲子（移除单位）">🧹</button>
</div>

<div id="boot-msg">正在加载 Phaser 3 …</div>

<script>
(function () {
'use strict';

/* ================= 全局开关 ================= */
// 测试期间保持 false：关闭全部拦截；发布前改 true
const isProduction = false;

/* ================= 安全体系（五层） ================= */
(function security() {
  const OFFICIAL = 'https://slildisn.github.io/egg-war/';
  const ALLOWED_HOSTS = ['slildisn.github.io', 'localhost', '127.0.0.1'];

  // 第二层：域名白名单（file:// 时 hostname 为空，放行）
  function hostAllowed() {
    const h = String(location.hostname || '').toLowerCase();
    if (!h) return true;
    for (let i = 0; i < ALLOWED_HOSTS.length; i++) {
      if (h === ALLOWED_HOSTS[i]) return true;
    }
    return false;
  }

  // 第三层：版权标记
  function authorIntact() {
    const m = document.querySelector('meta[name="author"]');
    return !!m && String(m.getAttribute('content')) === 'CYRENE_Original';
  }

  // 第四层：自毁处决
  function selfDestruct(reason) {
    if (window.__eggKilled) return;
    window.__eggKilled = true;

    try {
      if (window.__eggGame && window.__eggGame.destroy) window.__eggGame.destroy(true);
    } catch (e) { /* ignore */ }

    try {
      document.querySelectorAll('canvas').forEach(function (c) {
        try {
          const ctx = c.getContext('2d');
          if (ctx) ctx.clearRect(0, 0, c.width, c.height);
        } catch (e2) { /* ignore */ }
      });
    } catch (e3) { /* ignore */ }

    const box = document.createElement('div');
    box.id = 'egg-fatal';
    box.innerHTML = '<div class="q">❓</div>' +
      '<div class="t">FATAL ERROR: 核心记忆缺失，系统已自毁。</div>' +
      '<div class="s">正版地址：' + OFFICIAL + '</div>';
    document.body.appendChild(box);

    const kill = function (e) { e.preventDefault(); e.stopPropagation(); };
    ['click', 'pointerdown', 'touchstart', 'touchmove', 'keydown', 'contextmenu', 'wheel']
      .forEach(function (ev) { document.addEventListener(ev, kill, { capture: true }); });

    try { console.warn('[SECURITY] fatal:', reason || 'unknown'); } catch (e4) { /* ignore */ }
  }

  // 第一层：物理拦截
  function lockInputs() {
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('keydown', function (e) {
      const k = String(e.key || '').toLowerCase();
      const devtools = k === 'f12' ||
        ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) ||
        ((e.ctrlKey || e.metaKey) && (k === 'u' || k === 's'));
      if (devtools) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    try {
      document.documentElement.style.webkitUserSelect = 'none';
      document.documentElement.style.userSelect = 'none';
      document.body.style.webkitUserSelect = 'none';
      document.body.style.userSelect = 'none';
    } catch (e) { /* ignore */ }
  }

  window.__eggSecurity = {
    isProduction: isProduction,
    hostAllowed: hostAllowed,
    authorIntact: authorIntact,
    selfDestruct: selfDestruct
  };

  // 仅在发布模式启用全部拦截，本地测试零干扰
  if (!isProduction) return;

  if (!hostAllowed()) {
    try { location.replace(OFFICIAL); } catch (e) { /* ignore */ }
    return;
  }

  if (!authorIntact()) {
    selfDestruct('meta');
    return;
  }

  lockInputs();
  setInterval(function () {
    if (!authorIntact()) selfDestruct('meta-tampered');
  }, 4000);
})();

/* ================= Phaser CDN 多源加载 ================= */
(function () {
  const CDNS = [
    './phaser.min.js',
    'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
    'https://lib.baomitu.com/phaser/3.80.1/phaser.min.js',
    'https://cdn.staticfile.net/phaser/3.80.1/phaser.min.js',
    'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js'
  ];
  const msg = document.getElementById('boot-msg');
  let i = 0;

  function next() {
    if (i >= CDNS.length) {
      msg.textContent = 'Phaser 加载失败：所有 CDN 都连不上。\n请检查网络后刷新页面。';
      return;
    }
    const s = document.createElement('script');
    s.src = CDNS[i++];
    s.onload = function () {
      if (window.Phaser) {
        msg.style.display = 'none';
        bootGame();
      } else {
        next();
      }
    };
    s.onerror = function () { next(); };
    document.head.appendChild(s);
  }

  next();
})();

/* ================= 游戏本体 ================= */
function bootGame() {
  // —— 横竖屏自适应 ——
  const VIEW_W = (typeof window !== 'undefined' && window.innerWidth) || 1280;
  const VIEW_H = (typeof window !== 'undefined' && window.innerHeight) || 672;
  const IS_LANDSCAPE = VIEW_W > VIEW_H;

  const SIDE_BAND = IS_LANDSCAPE ? 90 : 100;

  let CANVAS_W = 1280;
  let CANVAS_H = 672;
  let GRID_X0 = 100;
  let GRID_Y0 = 20;
  let CELL = 120;
  const COLS = IS_LANDSCAPE ? 10 : 9;

  if (IS_LANDSCAPE) {
    // 高度贴着屏幕比例算，再由高度反推格子边长（5 行铺满）
    CANVAS_H = Math.round(1600 * (VIEW_H / VIEW_W));
    CELL = Math.floor((CANVAS_H - 40) / 5);
    CANVAS_W = CELL * COLS + SIDE_BAND * 2;
    GRID_X0 = SIDE_BAND;
    GRID_Y0 = 20;
  }

  const G = { x0: GRID_X0, y0: GRID_Y0, cell: CELL, cols: COLS, rows: 5 };
  const GRID_W = G.cols * G.cell;
  const GRID_H = G.rows * G.cell;

  const FONT = '"Yuanti SC", "YouYuan", "M PLUS Rounded 1c", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';

  const cellX = (col) => G.x0 + col * G.cell + G.cell / 2;
  const cellY = (row) => G.y0 + row * G.cell + G.cell / 2;

  /* 玩家单位（数值不动） */

  function makeRng(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function () {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  function lerpColor(a, b, t) {
    const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    return (Math.round(ar + (br - ar) * t) << 16) |
           (Math.round(ag + (bg - ag) * t) << 8) |
           Math.round(ab + (bb - ab) * t);
  }

  function hpColor(ratio) {
    const HEALTHY = 0x7fd8a8;
    const WARN = 0xffcf5c;
    const DANGER = 0xff9a72;
    if (ratio > 0.5) return lerpColor(WARN, HEALTHY, (ratio - 0.5) * 2);
    return lerpColor(DANGER, WARN, ratio * 2);
  }

    g.lineStyle(2, 0xa8703e, 0.95);
    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 18);

    // 炮管
    g.fillStyle(0x6b4a2a, 1);
    g.fillRoundedRect(half - 8, -10, 26, 20, 8);
    g.fillStyle(0x3e2a18, 1);
    g.fillCircle(half + 18, 0, 7);

    g.fillStyle(0x4a2c18, 1);

  }

  function drawShield(g, s) {
    const half = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, half - 2, s * 0.86, s * 0.24);

    g.fillStyle(0xc9d4e8, 1);
    g.fillRoundedRect(-half, -half + 4, s, s - 8, 16);
    g.fillStyle(0xe6ecf7, 0.9);
    g.fillRoundedRect(-half + 8, -half + 10, s - 16, (s - 8) * 0.36, 12);
    g.lineStyle(2, 0x8a99b5, 0.95);
    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 16);

    // 盾牌
    g.fillStyle(0xffffff, 0.85);
    g.beginPath();
    g.arc(half - 18, 0, 16, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(90), false);
    g.closePath();
    g.fillPath();
    g.lineStyle(3, 0x7f8ea8, 0.95);
    g.beginPath();
    g.arc(half - 18, 0, 16, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(90), false);
    g.strokePath();

    g.fillStyle(0x4a5568, 1);
    g.fillCircle(-22, -2, 5);
  }

  // 按轮廓画身体（暖黄软萌风：浅色高光 + 深色描边）
  function drawBodyShape(g, shape, size, color) {
    const half = size / 2;
    const light = 0xffffff;

    g.fillStyle(color, 1);
    if (shape === 'circle') {
      g.fillCircle(0, 0, half);
    } else if (shape === 'ellipse') {
      g.fillEllipse(0, 0, size, size * 0.78);
    } else if (shape === 'square') {
      g.fillRect(-half, -half, size, size);
    } else if (shape === 'capsule') {
      g.fillRoundedRect(-half, -half * 0.78, size, size * 0.78, half * 0.5);
    } else if (shape === 'diamond') {
      g.fillPoints([
        new Phaser.Geom.Point(0, -half),
        new Phaser.Geom.Point(half, 0),
        new Phaser.Geom.Point(0, half),
        new Phaser.Geom.Point(-half, 0)
      ], true);
    } else if (shape === 'shuttle') {
      g.fillPoints([
        new Phaser.Geom.Point(0, -half),
        new Phaser.Geom.Point(half * 0.86, 0),
        new Phaser.Geom.Point(0, half),
        new Phaser.Geom.Point(-half * 0.86, 0)
      ], true);
    } else if (shape === 'hexa') {
      g.fillPoints([
        new Phaser.Geom.Point(-half * 0.5, -half),
        new Phaser.Geom.Point(half * 0.5, -half),
        new Phaser.Geom.Point(half, 0),
        new Phaser.Geom.Point(half * 0.5, half),
        new Phaser.Geom.Point(-half * 0.5, half),
        new Phaser.Geom.Point(-half, 0)
      ], true);
    } else if (shape === 'teardrop') {
      g.fillCircle(0, half * 0.16, half * 0.84);
      g.fillTriangle(0, -half, -half * 0.62, half * 0.1, half * 0.62, half * 0.1);
    } else if (shape === 'blob') {
      g.fillCircle(-half * 0.24, 0, half * 0.8);
      g.fillCircle(half * 0.26, half * 0.06, half * 0.72);
    } else if (shape === 'star') {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const r = (i % 2 === 0) ? half : half * 0.62;
        const a = -Math.PI / 2 + (Math.PI / 5) * i;
        pts.push(new Phaser.Geom.Point(Math.cos(a) * r, Math.sin(a) * r));
      }
      g.fillPoints(pts, true);
    } else if (shape === 'fan') {
      g.beginPath();
      g.arc(0, half * 0.4, half * 1.12, Phaser.Math.DegToRad(180), Phaser.Math.DegToRad(360), false);
      g.closePath();
      g.fillPath();
    } else {
      g.fillRoundedRect(-half, -half, size, size, half * 0.42);
    }

    // 高光
    g.fillStyle(light, 0.34);
    if (shape === 'circle' || shape === 'teardrop' || shape === 'blob') {
      g.fillCircle(-half * 0.22, -half * 0.28, half * 0.42);
    } else if (shape === 'ellipse') {
      g.fillEllipse(-half * 0.16, -half * 0.22, size * 0.42, size * 0.26);
    } else {
      g.fillRoundedRect(-half * 0.72, -half * 0.62, size * 0.62, size * 0.3, size * 0.12);
    }

    // 描边
    g.lineStyle(3, 0x5c4326, 0.28);
    if (shape === 'circle') g.strokeCircle(0, 0, half);
    else if (shape === 'ellipse') g.strokeEllipse(0, 0, size, size * 0.78);
    else if (shape === 'square') g.strokeRect(-half, -half, size, size);
    else if (shape === 'capsule') g.strokeRoundedRect(-half, -half * 0.78, size, size * 0.78, half * 0.5);
    else if (shape === 'diamond') g.strokePoints([new Phaser.Geom.Point(0, -half), new Phaser.Geom.Point(half, 0), new Phaser.Geom.Point(0, half), new Phaser.Geom.Point(-half, 0)], true);
    else if (shape === 'shuttle') g.strokePoints([new Phaser.Geom.Point(0, -half), new Phaser.Geom.Point(half * 0.86, 0), new Phaser.Geom.Point(0, half), new Phaser.Geom.Point(-half * 0.86, 0)], true);
    else if (shape === 'hexa') g.strokePoints([new Phaser.Geom.Point(-half * 0.5, -half), new Phaser.Geom.Point(half * 0.5, -half), new Phaser.Geom.Point(half, 0), new Phaser.Geom.Point(half * 0.5, half), new Phaser.Geom.Point(-half * 0.5, half), new Phaser.Geom.Point(-half, 0)], true);
    else if (shape === 'star') {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const r = (i % 2 === 0) ? half : half * 0.62;
        const a = -Math.PI / 2 + (Math.PI / 5) * i;
        pts.push(new Phaser.Geom.Point(Math.cos(a) * r, Math.sin(a) * r));
      }
      g.strokePoints(pts, true);
    }
  }

  // 配件：占身体约 1/3，独立描边色块
  function drawAccessory(g, deco, size) {
    const k = size / 84;         // 以 84px 为基准缩放
    const u = size / 3;          // 配件目标尺寸

    if (deco === 'grain') {
      g.fillStyle(0xffd45c, 1); g.lineStyle(2, 0xb8862a, 1);
      g.fillRoundedRect(-u * 0.22, -size * 0.62, u * 0.44, u, u * 0.18);
      g.strokeRoundedRect(-u * 0.22, -size * 0.62, u * 0.44, u, u * 0.18);
      g.fillCircle(-u * 0.3, -size * 0.42, u * 0.16);
    } else if (deco === 'feather') {
      g.fillStyle(0xfff3c4, 1); g.lineStyle(2, 0xd9b45c, 1);
      g.fillTriangle(u * 0.2, -size * 0.62, u * 0.9, -size * 0.3, -u * 0.1, -size * 0.28);
      g.strokeTriangle(u * 0.2, -size * 0.62, u * 0.9, -size * 0.3, -u * 0.1, -size * 0.28);
    } else if (deco === 'silo') {
      g.fillStyle(0xc98a4a, 1); g.lineStyle(2, 0x8a5a2b, 1);
      g.fillRoundedRect(-u * 0.42, -size * 0.66, u * 0.84, u * 0.72, u * 0.16);
      g.strokeRoundedRect(-u * 0.42, -size * 0.66, u * 0.84, u * 0.72, u * 0.16);
    } else if (deco === 'leaf') {
      g.fillStyle(0x6fbf73, 1); g.lineStyle(2, 0x3f8a4a, 1);
      g.fillEllipse(u * 0.34, -size * 0.44, u, u * 0.55);
      g.strokeEllipse(u * 0.34, -size * 0.44, u, u * 0.55);
    } else if (deco === 'bolt') {
      g.fillStyle(0xfff6c0, 1); g.lineStyle(2, 0xd9b02a, 1);
      g.fillPoints([
        new Phaser.Geom.Point(-u * 0.2, -size * 0.66),
        new Phaser.Geom.Point(u * 0.26, -size * 0.4),
        new Phaser.Geom.Point(-u * 0.02, -size * 0.38),
        new Phaser.Geom.Point(u * 0.24, -size * 0.12),
        new Phaser.Geom.Point(-u * 0.3, -size * 0.34),
        new Phaser.Geom.Point(0, -size * 0.36)
      ], true);
    } else if (deco === 'flame') {
      g.fillStyle(0xff8a3c, 1); g.lineStyle(2, 0xc95a1a, 1);
      g.fillTriangle(u * 0.1, -size * 0.68, u * 0.75, -size * 0.2, -u * 0.5, -size * 0.2);
      g.strokeTriangle(u * 0.1, -size * 0.68, u * 0.75, -size * 0.2, -u * 0.5, -size * 0.2);
      g.fillStyle(0xffe0a0, 1);
      g.fillCircle(u * 0.1, -size * 0.3, u * 0.16);
    } else if (deco === 'scope') {
      g.lineStyle(3, 0x5c6b7a, 1);
      g.strokeCircle(size * 0.34, -size * 0.16, u * 0.42);
      g.lineStyle(2, 0xffffff, 0.85);
      g.lineBetween(size * 0.34 - u * 0.42, -size * 0.16, size * 0.34 + u * 0.42, -size * 0.16);
    } else if (deco === 'cannon') {
      g.fillStyle(0x5a4632, 1); g.lineStyle(2, 0x3a2c1e, 1);
      g.fillRoundedRect(size * 0.12, -u * 0.32, u * 0.9, u * 0.64, u * 0.2);
      g.strokeRoundedRect(size * 0.12, -u * 0.32, u * 0.9, u * 0.64, u * 0.2);
    } else if (deco === 'ice') {
      g.fillStyle(0xffffff, 1); g.lineStyle(2, 0x5aa8d8, 1);
      g.fillTriangle(-u * 0.3, -size * 0.66, 0, -size * 0.2, u * 0.3, -size * 0.66);
      g.strokeTriangle(-u * 0.3, -size * 0.66, 0, -size * 0.2, u * 0.3, -size * 0.66);
    } else if (deco === 'wood') {
      g.lineStyle(3, 0x8a5a2b, 0.95);
      g.lineBetween(-size * 0.32, -size * 0.3, size * 0.32, -size * 0.3);
      g.lineBetween(-size * 0.32, -size * 0.1, size * 0.32, -size * 0.1);
    } else if (deco === 'plate') {
      g.fillStyle(0xdfe6ef, 1); g.lineStyle(2, 0x7f8ea8, 1);
      g.fillRoundedRect(-size * 0.3, -size * 0.62, size * 0.6, u * 0.5, u * 0.16);
      g.strokeRoundedRect(-size * 0.3, -size * 0.62, size * 0.6, u * 0.5, u * 0.16);
    } else if (deco === 'spike') {
      g.fillStyle(0xf0e6d8, 1); g.lineStyle(2, 0x9a8a7a, 1);
      g.fillTriangle(-size * 0.52, -size * 0.08, -size * 0.24, -size * 0.5, -size * 0.24, 0);
      g.strokeTriangle(-size * 0.52, -size * 0.08, -size * 0.24, -size * 0.5, -size * 0.24, 0);
    } else if (deco === 'herb') {
      g.fillStyle(0x5fae7a, 1); g.lineStyle(2, 0x3f7a56, 1);
      g.fillEllipse(-u * 0.3, -size * 0.44, u * 0.8, u * 0.42);
      g.strokeEllipse(-u * 0.3, -size * 0.44, u * 0.8, u * 0.42);
    } else if (deco === 'halo') {
      g.lineStyle(4, 0xffe9a8, 1);
      g.strokeEllipse(0, -size * 0.56, size * 0.66, u * 0.42);
    } else if (deco === 'mine') {
      g.fillStyle(0x3a3a30, 1); g.lineStyle(2, 0x1e1e18, 1);
      g.fillCircle(0, -size * 0.52, u * 0.4);
      g.strokeCircle(0, -size * 0.52, u * 0.4);
      g.fillStyle(0xff5540, 1);
      g.fillCircle(0, -size * 0.52, u * 0.16);
    } else if (deco === 'dash') {
      g.lineStyle(3, 0xffffff, 0.9);
      g.lineBetween(size * 0.18, -u * 0.24, size * 0.62, -u * 0.24);
      g.lineBetween(size * 0.18, u * 0.1, size * 0.56, u * 0.1);
    } else {
      g.fillStyle(0xffe9b8, 1); g.lineStyle(2, 0xd9a94a, 1);
      g.strokeCircle(0, -size * 0.5, u * 0.42);
    }
  }

  // 统一入口：轮廓 + 高光 + 配件 + 眼睛
  function drawUnitBody(g, def) {
    const look = UNIT_LOOK[def.key] || ['round', 'M'];
    const shape = look[0];
    const size = SIZE_TIER[look[1]] || def.size || 84;

    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, size / 2 - 2, size * 0.8, size * 0.2);

    drawBodyShape(g, shape, size, def.color);
    drawAccessory(g, def.deco || 'round', size);

    g.fillStyle(0x4a2c18, 1);
    g.fillCircle(-size * 0.16, size * 0.04, size * 0.055);
    g.fillStyle(0xffffff, 0.9);
    g.fillCircle(-size * 0.175, size * 0.02, size * 0.02);
  }

  class GameScene extends Phaser.Scene {
    constructor() {
      super('GameScene');
    }

    create() {
      activeScene = this;

      this.corn = 50;
      this.over = false;
      this.paused = false;
      this.selected = null;
      this.clock = 0;

      this.units = [];
      this.enemies = [];
      this.bullets = [];
      this.drops = [];
      this.cards = [];

      this.baseHp = BASE.hp;
      this.state = 'PREPARING';
      this.waveIndex = 0;
      this.prepLeft = WAVES[0].prep;
      this.waveQueue = [];
      this.spawnTimer = 0;
      this.timers = { corn: 2.2 };
      this.pendingRow = null;
      this.plantCd = {};          // 每张卡的剩余种植冷却（秒）
      this.shovel = false;        // 铲子是否选中
      this.speedScale = 1;        // 1× / 2× 倍速
      this.deck = this.loadDeck();       // 已保存的 10 只卡组
      this.deckPicking = false;

      this.drawArena();
      this.buildCards();
      this.buildHud();
      this.bindInput();
      this.refreshHud();
      this.syncTools();

      this.state = 'PREPARING';
      this.paused = true;          // 选牌 / 剧情期间冻结

      pushLog('🎮 新一局开始');

      const quick = this.game.registry.get('quickDeck');
      if (quick) this.game.registry.set('quickDeck', false);

      if (!this.game.registry.get('storySeen')) {
        this.game.registry.set('storySeen', true);
        this.showStory();          // 剧情关闭 → 打开选牌
      } else if (quick && this.deck.length === 10) {
        this.closeDeck();
        this.paused = false;
        this.startPrep();          // 沿用卡组，直接进准备阶段
      } else {
        this.openDeck();
      }
    }

    /* ---------------- 场地 ---------------- */
    drawArena() {
      const bg = this.add.graphics();
      bg.fillGradientStyle(0xfff8ec, 0xfff8ec, 0xffeed2, 0xffeed2, 1);
      bg.fillRect(0, 0, CANVAS_W, CANVAS_H);

      const panel = this.add.graphics();
      panel.fillStyle(0x8fd6b4, 0.42);
      panel.fillRoundedRect(G.x0 - 10, G.y0 - 10, GRID_W + 20, GRID_H + 20, 22);
      panel.fillStyle(0x5c4326, 0.06);
      panel.fillRoundedRect(G.x0 - 4, G.y0 - 4, GRID_W + 8, GRID_H + 8, 18);

      // 圆角格子
      const cells = this.add.graphics();
      for (let r = 0; r < G.rows; r++) {
        for (let c = 0; c < G.cols; c++) {
          const color = (r + c) % 2 === 0 ? 0x9adfc0 : 0x8ad6b4;
          cells.fillStyle(color, 1);
          cells.fillRoundedRect(
            cellX(c) - (G.cell - 8) / 2,
            cellY(r) - (G.cell - 8) / 2,
            G.cell - 8,
            G.cell - 8,
            12
          );
        }
      }

      // 草地纹理
      const tex = this.add.graphics();
      const rnd = makeRng(20261116);
      for (let i = 0; i < 760; i++) {
        const x = G.x0 + rnd() * GRID_W;
        const y = G.y0 + rnd() * GRID_H;
        const light = rnd() > 0.42;
        const len = 4 + rnd() * 7;
        tex.lineStyle(2, light ? 0xffffff : 0x4fae86, light ? 0.20 : 0.10);
        tex.lineBetween(x, y, x + (rnd() - 0.5) * 5, y - len);
      }

      // 极淡网格线
      const lines = this.add.graphics();
      lines.lineStyle(1, 0xffffff, 0.10);
      for (let c = 0; c <= G.cols; c++) {
        lines.lineBetween(G.x0 + c * G.cell, G.y0, G.x0 + c * G.cell, G.y0 + GRID_H);
      }
      for (let r = 0; r <= G.rows; r++) {
        lines.lineBetween(G.x0, G.y0 + r * G.cell, G.x0 + GRID_W, G.y0 + r * G.cell);
      }

      // 首页同款鸡蛋装饰（纯装饰，不参与任何玩法逻辑）
      const deco = this.add.graphics();
      deco.fillStyle(0xfffdf6, 0.55);
      deco.fillEllipse(G.x0 + 38, G.y0 + 34, 24, 32);
      deco.fillEllipse(G.x0 + GRID_W - 44, G.y0 + 38, 20, 26);
      deco.fillEllipse(G.x0 + 34, G.y0 + GRID_H - 34, 18, 24);
      deco.fillStyle(0xfff3c4, 0.45);
      deco.fillCircle(G.x0 + 30, G.y0 + 28, 6);
      deco.fillCircle(G.x0 + GRID_W - 52, G.y0 + 32, 5);

      // 第三层：隐藏版权水印（最底层，几乎透明）
      this.add.text(CANVAS_W / 2, CANVAS_H / 2, 'CYRENE', {
        fontFamily: FONT, fontSize: '150px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setAlpha(0.05).setDepth(-10);

      const cy = G.y0 + GRID_H / 2;

      // 左侧暖黄鸡窝（宽度 = 左侧留白 - 6）
      const nestW = Math.max(64, G.x0 - 6);
      const nestX = 2;
      const nestCx = nestX + nestW / 2;

      const nest = this.add.graphics();
      nest.fillStyle(0x5c4326, 0.10);
      nest.fillRoundedRect(nestX + 4, G.y0 + 14, nestW, GRID_H - 16, 18);

      nest.fillStyle(0xffc94d, 1);
      nest.fillRoundedRect(nestX, G.y0 + 8, nestW, GRID_H - 16, 18);
      nest.fillStyle(0xffd97a, 0.85);
      nest.fillRoundedRect(nestX + 6, G.y0 + 16, nestW - 12, 120, 14);
      nest.lineStyle(2, 0xe0a12f, 0.9);
      nest.strokeRoundedRect(nestX, G.y0 + 8, nestW, GRID_H - 16, 18);

      nest.lineStyle(3, 0xd9a03a, 0.45);
      for (let i = 0; i < 5; i++) {
        const y = G.y0 + 70 + i * 92;
        nest.beginPath();
        nest.moveTo(nestX + 10, y);
        nest.lineTo(nestX + nestW - 8, y + 14);
        nest.strokePath();
        nest.beginPath();
        nest.moveTo(nestX + nestW - 8, y + 40);
        nest.lineTo(nestX + 10, y + 54);
        nest.strokePath();
      }

      nest.fillStyle(0xfff8e8, 1);
      nest.fillCircle(nestCx, cy + 84, 15);
      nest.lineStyle(2, 0xe8cfa0, 1);
      nest.strokeCircle(nestCx, cy + 84, 15);

      this.add.text(nestCx, cy - 48, '鸡窝', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);
      this.add.text(nestCx, cy - 20, '基地', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);

      // 基地血量
      this.baseBarBg = this.add.rectangle(nestCx, cy + 36, 68, 10, 0x5c4326, 0.20);
      this.baseBarFg = this.add.rectangle(nestCx - 32, cy + 36, 64, 6, 0x7fd8a8).setOrigin(0, 0.5);
      this.baseHpText = this.add.text(nestCx, cy + 58, String(BASE.hp), {
        fontFamily: FONT, fontSize: '18px', color: '#5a3b12', fontStyle: 'bold'
      }).setOrigin(0.5);

      // 右侧橘红出兵口（贴画布右边缘，随宽度自适应）
      const gateW = Math.max(64, CANVAS_W - (G.x0 + GRID_W) - 6);
      const gateX = CANVAS_W - gateW - 2;
      const gateCx = gateX + gateW / 2;
      this.gateCenterX = gateCx;

      const gate = this.add.graphics();
      gate.fillStyle(0x5c4326, 0.10);
      gate.fillRoundedRect(gateX + 2, G.y0 + 14, gateW, GRID_H - 16, 18);

      gate.fillStyle(0xffb08a, 1);
      gate.fillRoundedRect(gateX, G.y0 + 8, gateW, GRID_H - 16, 18);
      gate.fillStyle(0xffd6c0, 0.8);
      gate.fillRoundedRect(gateX + 6, G.y0 + 16, gateW - 12, 120, 14);
      gate.lineStyle(2, 0xe8996f, 0.95);
      gate.strokeRoundedRect(gateX, G.y0 + 8, gateW, GRID_H - 16, 18);

      gate.fillStyle(0xfff0e4, 0.85);
      for (let i = 0; i < 4; i++) {
        gate.fillRoundedRect(gateCx - 23, G.y0 + 96 + i * 122, 46, 12, 6);
      }

      this.add.text(gateCx, cy - 48, '公鸡', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);
      this.add.text(gateCx, cy - 20, '来袭', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);
    }

    /* ---------------- 卡牌 ---------------- */
    buildCards() {
      // 只渲染本局卡组（未选牌时留空）
      const keys = (this.deck && this.deck.length)
        ? this.deck.slice(0, 10)
        : [];
      const defs = keys.map((k) => ({
        key: k,
        label: UNIT_DEFS[k].name,
        cost: UNIT_DEFS[k].cost,
        color: UNIT_DEFS[k].color,
        unlock: UNIT_DEFS[k].unlock || 1
      }));


      const bar = document.getElementById('card-bar');
      if (!bar) return;
      bar.innerHTML = '';

      defs.forEach((d) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card';
        btn.dataset.key = d.key;
        btn.dataset.unlock = String(d.unlock || 1);

        const ico = document.createElement('span');
        const look = UNIT_LOOK[d.key] || ['round', 'M'];
        ico.className = 'card-ico shape-' + look[0];
        ico.style.background = '#' + d.color.toString(16).padStart(6, '0');

        const txt = document.createElement('span');
        txt.className = 'card-txt';
        const nm = document.createElement('b');
        nm.textContent = d.label;
        const cost = document.createElement('i');
        cost.textContent = d.cost + ' 玉米粒';
        txt.appendChild(nm);
        txt.appendChild(cost);

        const mask = document.createElement('span');
        mask.className = 'card-mask';

        const cdTxt = document.createElement('span');
        cdTxt.className = 'card-cd';

        btn.appendChild(ico);
        btn.appendChild(txt);
        btn.appendChild(mask);
        btn.appendChild(cdTxt);
        btn.addEventListener('click', () => this.selectCard(d.key));
        bar.appendChild(btn);
      });

      this.syncCards();
    }

    selectCard(key) {
      if (this.over || this.paused) return;
      const d = UNIT_DEFS[key];
      if (d && (d.unlock || 1) > (this.waveIndex + 1)) return;   // 未解锁
      if ((this.plantCd[key] || 0) > 0) return;   // 卡槽冷却中，禁止选中
      this.shovel = false;                        // 选卡与铲子互斥
      this.syncTools();
      this.selected = this.selected === key ? null : key;
      this.syncCards();
    }

    syncCards() {
      const bar = document.getElementById('card-bar');
      if (!bar) return;
      bar.querySelectorAll('.card').forEach((btn) => {
        const key = btn.dataset.key;
        const def = UNIT_DEFS[key];
        if (!def) return;
        const waveLock = (def.unlock || 1) > (this.waveIndex + 1);
        const cooling = (this.plantCd[key] || 0) > 0;

        btn.classList.toggle('wave-lock', waveLock);
        btn.classList.toggle('cooling', cooling && !waveLock);
        btn.classList.toggle('locked', cooling || waveLock);
        btn.classList.toggle('sel', !cooling && !waveLock && this.selected === key);
        // 冷却优先拦截，其次费用；波次锁直接显示解锁提示
        btn.classList.toggle('off', !cooling && !waveLock && this.corn < def.cost);

        const txt = btn.querySelector('.card-cd');
        if (txt) {
          if (waveLock) txt.textContent = '第 ' + (def.unlock || 1) + ' 波解锁';
          else if (!cooling) txt.textContent = '';
        }
      });
    }

    /* ---------------- HUD ---------------- */
    buildHud() {
      const pillW = Math.min(900, CANVAS_W - 80);
      const pillH = 28;
      const pillY = CANVAS_H - 38;
      const pill = this.add.graphics();
      pill.fillStyle(0xfffdf8, 0.94);
      pill.fillRoundedRect(CANVAS_W / 2 - pillW / 2, pillY, pillW, pillH, 14);
      pill.lineStyle(2, 0xffcf5c, 0.95);
      pill.strokeRoundedRect(CANVAS_W / 2 - pillW / 2, pillY, pillW, pillH, 14);

      this.add.text(CANVAS_W / 2, pillY + 14, '① 点卡牌选中   ② 点草坪格子放置   ③ 点掉落的玉米粒 +25', {
        fontFamily: FONT, fontSize: '15px', color: '#7b6650'
      }).setOrigin(0.5);

    }

    setPrepLine(text) {
      const el = document.getElementById('prep-line');
      if (!el) return;
      if (!text) { el.hidden = true; return; }
      if (el.textContent !== text) el.textContent = text;
      el.hidden = false;
    }

    refreshHud() {
      const el = document.getElementById('corn-val');
      if (el) el.textContent = String(this.corn);
      this.syncCards();
    }

    bindInput() {
      this.hoverCell = this.add.rectangle(0, 0, G.cell - 10, G.cell - 10, 0xffffff, 0.10)
        .setVisible(false).setDepth(5);

      const zone = this.add.zone(G.x0, G.y0, GRID_W, GRID_H).setOrigin(0);
      zone.setInteractive(new Phaser.Geom.Rectangle(0, 0, GRID_W, GRID_H), Phaser.Geom.Rectangle.Contains);
      zone.on('pointerdown', (pointer) => this.onGridClick(pointer));
      zone.on('pointermove', (pointer) => this.onPointerMove(pointer));
      zone.on('pointerout', () => this.hoverCell.setVisible(false));
    }

    onPointerMove(pointer) {
      if (!this.selected || this.over) {
        this.hoverCell.setVisible(false);
        return;
      }
      const col = Math.floor((pointer.x - G.x0) / G.cell);
      const row = Math.floor((pointer.y - G.y0) / G.cell);
      if (col < 0 || col >= G.cols || row < 0 || row >= G.rows) {
        this.hoverCell.setVisible(false);
        return;
      }
      const busy = !!this.findUnit(row, col);
      this.hoverCell.setFillStyle(busy ? 0xffa27a : 0xbdf3d8, 0.32);
      this.hoverCell.setPosition(cellX(col), cellY(row));
      this.hoverCell.setVisible(true);
    }

    onGridClick(pointer) {
      if (this.over || this.paused) return;

      const col = Math.floor((pointer.x - G.x0) / G.cell);
      const row = Math.floor((pointer.y - G.y0) / G.cell);
      if (col < 0 || col >= G.cols || row < 0 || row >= G.rows) return;

      // 铲子模式：点场上的单位即可移除并返还 30% 费用
      if (this.shovel) {
        const target = this.findUnit(row, col);
        if (target) this.digUnit(target);
        else this.flash(pointer.x, pointer.y, '这里没有单位', '#b35a1f');
        return;
      }

      if (!this.selected) return;

      if (this.findUnit(row, col)) {
        this.flash(pointer.x, pointer.y, '这里已经有蛋了', '#d9673f');
        return;
      }

      const def = UNIT_DEFS[this.selected];
      if (this.corn < def.cost) {
        this.flash(pointer.x, pointer.y, '玉米粒不够', '#d9673f');
        return;
      }

      const usedKey = this.selected;
      this.corn -= def.cost;
      this.spawnUnit(usedKey, row, col);
      this.startCardCooldown(usedKey);
      this.selected = null;
      this.hoverCell.setVisible(false);
      this.refreshHud();
    }

    findUnit(row, col) {
      return this.units.find((u) => u.row === row && u.col === col);
    }

    flash(x, y, msg, color) {
      const t = this.add.text(x, y, msg, { fontFamily: FONT, fontSize: '22px', color })
        .setOrigin(0.5).setDepth(50);
      this.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 800, onComplete: () => t.destroy() });
    }

    /* ---------------- 特效 ---------------- */
    sparkle(x, y) {
      const ring = this.add.circle(x, y, 12, 0xffe9a8, 0.85).setStrokeStyle(3, 0xffd54a).setDepth(40);
      ring.setScale(0.35);
      this.tweens.add({
        targets: ring, scale: 1.7, alpha: 0, duration: 330, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });

      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 * i) / 6;
        const dot = this.add.circle(x, y, 3.5, 0xfff2b0).setDepth(40);
        this.tweens.add({
          targets: dot,
          x: x + Math.cos(a) * 34,
          y: y + Math.sin(a) * 34,
          alpha: 0,
          duration: 350,
          ease: 'Cubic.easeOut',
          onComplete: () => dot.destroy()
        });
      }
    }

    shatter(x, y, color, count, depth) {
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const dist = 26 + Math.random() * 34;
        const w = 7 + Math.random() * 8;
        const h = 6 + Math.random() * 8;
        const shard = this.add.rectangle(x, y, w, h, color, 0.95)
          .setDepth(depth || 30)
          .setStrokeStyle(1, 0x000000, 0.12);
        this.tweens.add({
          targets: shard,
          x: x + Math.cos(ang) * dist,
          y: y + Math.sin(ang) * dist + 16,
          angle: Phaser.Math.Between(-180, 180),
          alpha: 0,
          duration: 380 + Math.random() * 160,
          ease: 'Cubic.easeOut',
          onComplete: () => shard.destroy()
        });
      }
    }

    hitFlash(x, y, w, h) {
      const f = this.add.rectangle(x, y, w, h, 0xfff3c4, 0.55).setDepth(25);
      this.tweens.add({ targets: f, alpha: 0, duration: 130, onComplete: () => f.destroy() });
    }

    /* ---------------- 玩家单位 ---------------- */
    spawnUnit(key, row, col) {
      const def = UNIT_DEFS[key];
      const x = cellX(col);
      const y = cellY(row);

      const g = this.add.graphics();
      drawUnitBody(g, def);
      g.setPosition(x, y);

      g.setScale(0.6);
      this.tweens.add({ targets: g, scale: 1, duration: 240, ease: 'Back.easeOut' });

      const barY = y - def.size / 2 - 20;
      const bar = this.makeBar(x, barY, def.size);

      const unit = {
        key, row, col, x, y,
        hp: def.hp,
        maxHp: def.hp,
        body: g,
        barY,
        bar,
        phase: Math.random() * Math.PI * 2,
        ai: def.ai || null,
        cd: key === 'hen' ? 2.5 : (key === 'healer' ? 3 : 0.4),
        removed: false,
        dashSpeed: 520,
        dashEnd: x + G.cell
      };
      unit.size = def.size;

      // 母鸡专属：技能冷却环 + 读秒（纯视觉，不参与任何判定）
      if (CD_DISPLAY[key] || (def.ai && def.ai !== "tank" && def.ai !== "bomber" && def.ai !== "charger")) {
        unit.cdLabel = this.add.text(x, barY + 11, '', {
          fontFamily: FONT, fontSize: '11px', color: '#8a5a2b', fontStyle: 'bold'
        }).setOrigin(0.5).setDepth(16).setVisible(false);
        unit.wasCooling = unit.cd > 0.001;
        this.updateCdLabel(unit);
      }

      this.units.push(unit);
      this.syncBar(bar, 0, x, barY);

      pushLog('🥚 放置 ' + def.name + ' → 第' + (row + 1) + '行 / 第' + (col + 1) + '列');
    }

    /* ---------------- 冷却读秒 UI（只读 u.cd，不改数值与判定） ---------------- */
    updateCdLabel(u) {
      if (!u || !u.cdLabel || !u.cdLabel.active) return;

      const cooling = u.cd > 0.001;

      if (cooling) {
        // 血条下方一行暖棕小字，带一位小数
        u.cdLabel.setText('冷却：' + u.cd.toFixed(1) + '秒');
        u.cdLabel.setVisible(true);
        if (u.body) u.body.setAlpha(0.72);          // 冷却中略微置灰（不压暗过头）
      } else {
        u.cdLabel.setVisible(false);
        if (u.body) u.body.setAlpha(1);
      }

      // 冷却刚结束的一瞬间：一次微弱暖光
      if (u.wasCooling && !cooling) {
        u.wasCooling = false;
        this.readyGlow(u);
      } else if (cooling) {
        u.wasCooling = true;
      }
    }

    readyGlow(u) {
      const ring = this.add.circle(u.x, u.y, (u.size || 84) / 2 - 2, 0xffe6a8, 0.22)
        .setStrokeStyle(3, 0xffcf5c, 0.85).setDepth(14);
      this.tweens.add({
        targets: ring, scale: 1.6, alpha: 0, duration: 320, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });
    }

    /* ---------------- 新单位：治愈 / 炸弹 / 冲锋 ---------------- */
    removeUnit(u) {
      if (!u || u.removed) return;
      u.removed = true;
      this.units = this.units.filter((x) => x !== u);
      if (u.body) u.body.destroy();
      if (u.bar && u.bar.bg) {
        u.bar.bg.destroy();
        u.bar.fg.destroy();
        u.bar.bg = null;
      }
      if (u.cdLabel) { u.cdLabel.destroy(); u.cdLabel = null; }
    }

    healAround(u, amount) {
      let healed = 0;
      for (const o of this.units) {
        if (o === u || o.removed) continue;
        if (Math.abs(o.row - u.row) > 1 || Math.abs(o.col - u.col) > 1) continue;
        if (o.hp >= o.maxHp) continue;
        o.hp = Math.min(o.maxHp, o.hp + amount);
        this.setBarTarget(o.bar, o.hp, o.maxHp);
        healed += 1;
        this.flash(o.x, o.y - 26, '+' + amount, '#5fae7a');
      }

      const ring = this.add.circle(u.x, u.y, 38, 0xffffff, 0.10)
        .setStrokeStyle(3, 0x7fd8a8, 0.9).setDepth(12);
      this.tweens.add({
        targets: ring, scale: 2.0, alpha: 0, duration: 460, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });

      if (healed) pushLog('💗 治愈母鸡回复 ' + healed + ' 个单位 +' + amount);
    }

    detonate(u, dmgArg) {
      if (!u || u.removed) return;
      const dmg = dmgArg || 140;
      const cx = u.x;

      const victims = this.enemies.filter((e) =>
        Math.abs(e.row - u.row) <= 1 && Math.abs(e.x - cx) <= 180
      );
      victims.forEach((e) => this.damageEnemy(e, dmg));

      const ring = this.add.circle(cx, u.y, 26, 0xfff1c9, 0.30)
        .setStrokeStyle(4, 0xffb066, 0.9).setDepth(35);
      this.tweens.add({
        targets: ring, scale: 7, alpha: 0, duration: 440, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });

      const core = this.add.circle(cx, u.y, 16, 0xffffff, 0.55).setDepth(36);
      this.tweens.add({
        targets: core, scale: 2.6, alpha: 0, duration: 260,
        onComplete: () => core.destroy()
      });

      this.shatter(cx, u.y, 0x4a4a5a, 7, 30);
      pushLog('💣 炸弹小鸡引爆 · 命中 ' + victims.length + ' 只公鸡');
      this.removeUnit(u);
    }

    chargeBurst(u) {
      const ring = this.add.circle(u.x, u.y, 16, 0xdfefff, 0.45)
        .setStrokeStyle(3, 0x7fc4f0, 0.9).setDepth(30);
      this.tweens.add({
        targets: ring, scale: 2.4, alpha: 0, duration: 260,
        onComplete: () => ring.destroy()
      });
      this.shatter(u.x, u.y, 0x7fc4f0, 5, 30);
    }

    /* ---------------- 血条 ---------------- */
    makeBar(x, y, w) {
      const bg = this.add.rectangle(x, y, w + 6, 9, 0x5c4326, 0.16);
      const fg = this.add.rectangle(x - w / 2, y, w, 5, 0x7fd8a8).setOrigin(0, 0.5);
      return { bg, fg, w, target: 1, shown: 1 };
    }

    setBarTarget(bar, hp, maxHp) {
      bar.target = Phaser.Math.Clamp(hp / maxHp, 0, 1);
    }

    syncBar(bar, dt, x, y) {
      if (!bar || !bar.bg || !bar.bg.active) return;
      if (dt > 0) {
        bar.shown += (bar.target - bar.shown) * Math.min(1, dt * 12);
        if (Math.abs(bar.target - bar.shown) < 0.002) bar.shown = bar.target;
      }
      bar.bg.setPosition(x, y);
      bar.fg.displayWidth = Math.max(0.01, bar.w * bar.shown);
      bar.fg.setPosition(x - bar.w / 2, y);
      bar.fg.fillColor = hpColor(bar.shown);
    }

    /* ---------------- 敌人 ---------------- */
    spawnEnemy(rowArg, typeArg, xArg) {
      const typeKey = typeArg || 'normal';
      const t = ENEMY_TYPES[typeKey] || ENEMY_TYPES.normal;

      const row = (typeof rowArg === 'number' && rowArg >= 0 && rowArg < G.rows)
        ? rowArg
        : Phaser.Math.Between(0, G.rows - 1);
      const y = cellY(row);
      const x = xArg || (CANVAS_W - 26);

      const body = this.add.graphics();
      drawRooster(body, t.w, t.h, t);
      body.setPosition(x, y);

      const barY = y - t.h / 2 - 26;
      const bar = this.makeBar(x, barY, Math.max(56, t.w - 8));

      const e = {
        type: typeKey,
        row, x, y,
        hp: t.hp,
        maxHp: t.hp,
        attackCd: 0,
        speed: t.speed,
        w: t.w,
        h: t.h,
        peckDmg: t.peckDmg,
        peckRate: t.peckRate,
        shockEvery: t.shockEvery || 0,
        shockDmg: t.shockDmg || 0,
        dr: t.dr || 0,
        slowResist: t.slowResist || 0,
        poisonDmg: t.poisonDmg || 0,
        rage: !!t.rage,
        summonEvery: t.summonEvery || 0,
        summonType: t.summonType || 'gale',
        summonLeft: t.summonEvery || 0,
        burnDmg: t.burnDmg || 0,
        burnCd: t.burnCd || 0,
        burnLeft: t.burnCd || 0,
        flying: !!t.flying,
        slowT: 0,
        slowFactor: 1,
        peckCount: 0,
        body,
        barY,
        bar,
        walkPhase: 0
      };
      this.enemies.push(e);
      this.syncEnemy(e);
      this.syncBar(bar, 0, x, barY);

      pushLog('🦃 第' + (this.waveIndex + 1) + '波 · 第' + (row + 1) + '行 ｜ ' + t.name +
        ' HP ' + t.hp);
    }

    syncEnemy(e) {
      e.body.setPosition(e.x, e.y);
    }

    findBlocker(e) {
      let best = null;
      for (const u of this.units) {
        if (u.row !== e.row) continue;
        const gap = e.x - u.x;
        const reach = 46 + (e.w || 70) / 2;
        if (gap <= reach && gap >= -50) {
          if (!best || u.x > best.x) best = u;
        }
      }
      return best;
    }

    damageEnemy(e, dmg) {
      const real = e.dr ? dmg * (1 - e.dr) : dmg;   // 铁盔 30% 减伤
      e.hp -= real;

      if (e.hp <= 0) {
        this.enemies = this.enemies.filter((x) => x !== e);
        e.bar.bg.destroy();
        e.bar.fg.destroy();
        e.bar.bg = null;
        this.shatter(e.x, e.y, 0xff6a4d, 7, 30);
        this.tweens.add({
          targets: e.body, alpha: 0, scaleX: 1.2, scaleY: 1.2, duration: 200,
          onComplete: () => e.body.destroy()
        });
        pushLog('💥 公鸡倒下 第' + (e.row + 1) + '行');
      } else {
        this.setBarTarget(e.bar, e.hp, e.maxHp);
        this.hitFlash(e.x, e.y, (e.w || 70) * 0.9, (e.h || 82) * 0.9);
        this.tweens.add({ targets: e.body, scaleX: 1.08, scaleY: 0.94, duration: 70, yoyo: true });
        pushLog('🎯 命中 第' + (e.row + 1) + '行 ｜ -' + dmg + ' → 剩余 ' + Math.max(0, e.hp));
      }
    }

    damageUnit(u, dmg, attacker) {
      const red = this.shieldReduceFor(u);          // 盾卫光环：相邻友军减伤
      if (red > 0) dmg = dmg * (1 - red);
      u.hp -= dmg;

      if (u.hp <= 0) {
        u.removed = true;
        this.units = this.units.filter((x) => x !== u);
        u.bar.bg.destroy();
        u.bar.fg.destroy();
        u.bar.bg = null;
        if (u.cdLabel) { u.cdLabel.destroy(); u.cdLabel = null; }

        const color = (UNIT_DEFS[u.key] && UNIT_DEFS[u.key].color) || 0xffd8a8;
        this.shatter(u.x, u.y, color, u.key === 'rock' ? 9 : 6, 30);
        this.tweens.add({
          targets: u.body, alpha: 0, scaleX: 1.15, scaleY: 1.15, duration: 180,
          onComplete: () => u.body.destroy()
        });
        this.flash(u.x, u.y - 20, '碎了！', '#d9673f');
        pushLog('💔 ' + UNIT_DEFS[u.key].name + ' 被啄碎（第' + (u.row + 1) + '行）');
      } else {
        this.setBarTarget(u.bar, u.hp, u.maxHp);
        this.tweens.add({ targets: u.body, alpha: 0.5, duration: 60, yoyo: true });

        // 重甲反伤：被啃时反弹伤害给公鸡
        if (u.key === 'reflector' && attacker && attacker.hp > 0) {
          const reflect = 25;
          this.damageEnemy(attacker, reflect);
          this.flash(attacker.x, attacker.y - 34, '-' + reflect, '#8e3b8e');
          const ring = this.add.circle(u.x, u.y, 26, 0xe0d4ff, 0.30)
            .setStrokeStyle(3, 0x7f6aa8, 0.9).setDepth(22);
          this.tweens.add({
            targets: ring, scale: 1.8, alpha: 0, duration: 280,
            onComplete: () => ring.destroy()
          });
          pushLog('🛡 反伤 -' + reflect + ' → 公鸡剩余 ' + Math.max(0, attacker.hp));
        }
      }
    }

    giantShock(e) {
      const victims = this.units.filter((u) =>
        !u.removed && Math.abs(u.row - e.row) <= 1 && Math.abs(u.x - e.x) <= 180
      );
      victims.forEach((u) => this.damageUnit(u, e.shockDmg, null));

      const ring = this.add.circle(e.x, e.y, 40, 0xe0c8ff, 0.16)
        .setStrokeStyle(4, 0x8e5bb5, 0.75).setDepth(28);
      this.tweens.add({
        targets: ring, scale: 4.2, alpha: 0, duration: 520, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });
      pushLog('💥 ' + ENEMY_TYPES[e.type].name + ' 震慑 · 命中 ' + victims.length + ' 个单位');
    }

    /* ---------------- 子弹 ---------------- */
    fireBullet(u, dmg, speed, radius, extra) {
      const damage = dmg || 26;
      const spd = speed || 430;
      const r = radius || 7.5;
      const x = u.x + 36;
      const glow = this.add.circle(x, u.y, r + 5, 0xffd08a, 0.26).setDepth(16);
      const core = this.add.circle(x, u.y, r, 0xfff6e0).setStrokeStyle(2, 0xffa94d).setDepth(17);
      this.bullets.push({
        x, y: u.y, row: u.row, speed: spd, dmg: damage, core, glow, t: 0,
        slow: (extra && extra.slow) || 0,
        slowTime: (extra && extra.slowTime) || 0
      });
    }

    nearestEnemyInRange(u, range) {
      let best = null;
      for (const e of this.enemies) {
        if (e.row !== u.row) continue;
        if (e.x <= u.x + 10) continue;
        if (e.x - u.x > range) continue;
        if (!best || e.x < best.x) best = e;
      }
      return best;
    }

    nearestEnemyAhead(u) {
      let best = null;
      for (const e of this.enemies) {
        if (e.row !== u.row) continue;
        if (e.x <= u.x + 10) continue;
        if (!best || e.x < best.x) best = e;
      }
      return best;
    }

    removeBullet(b) {
      b.core.destroy();
      b.glow.destroy();
      this.bullets = this.bullets.filter((x) => x !== b);
    }

    /* ---------------- 鸡窝基地血量 ---------------- */
    damageBase(dmg) {
      if (this.over || this.baseHp <= 0) return;
      this.baseHp = Math.max(0, this.baseHp - dmg);
      this.updateBaseHp();
      this.flash(78, G.y0 + GRID_H / 2 + 58, '-' + dmg, '#d9673f');
      pushLog('🏠 鸡窝被啄 -' + dmg + ' → 剩余 ' + this.baseHp);

      if (this.baseHp <= 0) this.gameOver();
    }

    updateBaseHp() {
      if (!this.baseBarFg) return;
      const ratio = Phaser.Math.Clamp(this.baseHp / BASE.hp, 0, 1);
      this.baseBarFg.displayWidth = Math.max(0.01, 64 * ratio);
      this.baseBarFg.fillColor = hpColor(ratio);
      if (this.baseHpText) this.baseHpText.setText(String(this.baseHp));
    }

    /* ---------------- 掉落玉米粒 ---------------- */
    dropCorn(x, y0, targetY, life, owner) {
      const glow = this.add.circle(x, y0, 27, 0xfff0b8, 0.20).setDepth(18);
      const main = this.add.circle(x, y0, 15, 0xffd54a).setStrokeStyle(3, 0xe0a800).setDepth(20);
      const hi = this.add.circle(x - 5, y0 - 5, 4, 0xfff2b0).setDepth(21);
      // 视觉半径 15 不变；点击热区放大到半径 40（直径 80px），更好点中
      main.setInteractive({
        hitArea: new Phaser.Geom.Circle(15, 15, 40),
        hitAreaCallback: Phaser.Geom.Circle.Contains,
        useHandCursor: true
      });

      const d = {
        x, y: y0, vy: 0, targetY, life, main, hi, glow,
        owner: owner || null, alive: true,
        phase: Math.random() * Math.PI * 2,
        landed: false,
        settling: false,
        autoLeft: null          // 落地后才开始倒计时
      };

      main.on('pointerdown', (pointer, lx, ly, event) => {
        if (event && event.stopPropagation) event.stopPropagation();
        this.collectCorn(d);
      });

      this.drops.push(d);
    }

    removeDrop(d) {
      if (!d.alive) return;
      d.alive = false;
      d.main.destroy();
      d.hi.destroy();
      this.drops = this.drops.filter((x) => x !== d);
    }

    collectCorn(d) {
      // 点任意一颗 = 全场一起收
      if (!this.drops.length) return;
      const all = this.drops.slice();
      let total = 0;
      all.forEach((one) => {
        if (!one.alive) return;
        total += 1;
        this.collectOne(one);
      });
      if (total > 1) pushLog('🌽 一键全收 · ' + total + ' 颗');
    }

    collectOne(d) {
      if (!d.alive) return;
      this.corn += 25;
      this.refreshHud();
      this.sparkle(d.x, d.y);

      // 玉米粒飞向右上角数字
      const fly = this.add.circle(d.main.x, d.main.y, 12, 0xffd54a)
        .setStrokeStyle(2, 0xe0a800).setDepth(45);
      this.tweens.add({
        targets: fly,
        x: CANVAS_W - 40, y: 26, scale: 0.4, alpha: 0.95,
        duration: 430, ease: 'Cubic.easeIn',
        onComplete: () => { fly.destroy(); this.pulseCorn(); }
      });

      // 轻快的缩小消失反馈
      d.alive = false;
      this.drops = this.drops.filter((x) => x !== d);
      this.tweens.add({
        targets: [d.main, d.hi, d.glow],
        scale: 0.15, alpha: 0,
        duration: 150, ease: 'Back.easeIn',
        onComplete: () => { d.main.destroy(); d.hi.destroy(); d.glow.destroy(); }
      });

      pushLog('🌽 拾取玉米粒 +25 → 当前 ' + this.corn);
    }

    pulseCorn() {
      const el = document.getElementById('corn-val');
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }

    dropSkyCorn() {
      const x = Phaser.Math.Between(G.x0 + 50, G.x0 + GRID_W - 50);
      const targetY = Phaser.Math.Between(G.y0 + 50, G.y0 + GRID_H - 50);
      this.dropCorn(x, -30, targetY, 9, null);
    }

    dropHenCorn(u) {
      const owned = this.drops.filter((d) => d.owner === u).length;
      if (owned >= 3) return;
      this.dropCorn(u.x, u.y - 46, u.y - 76, 8, u);
    }

    /* ---------------- 公鸡来袭预警 ---------------- */
    showSpawnWarning(row) {
      const y = cellY(row);

      // 红光闪烁（3 秒，跟着出兵倒计时一起呼吸）
      const halo = this.add.graphics().setDepth(9);
      halo.fillStyle(0xd89b5a, 0.28);
      halo.fillEllipse(0, 0, 96, 108);
      halo.lineStyle(4, 0xb97a3c, 0.7);
      halo.strokeEllipse(0, 0, 96, 108);
      halo.setPosition(this.gateCenterX || (CANVAS_W - 46), y);

      this.tweens.add({
        targets: halo,
        alpha: 0.25, scaleX: 1.14, scaleY: 1.14,
        duration: 300, yoyo: true, repeat: 4, ease: 'Sine.easeInOut',
        onComplete: () => {
          this.tweens.add({
            targets: halo, alpha: 0, duration: 180,
            onComplete: () => halo.destroy()
          });
        }
      });

      const tip = this.add.text(this.gateCenterX || (CANVAS_W - 46), y - 66, '公鸡来袭 3s', {
        fontFamily: FONT, fontSize: '19px', color: '#8a5a2b', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(10);

      this.tweens.add({
        targets: tip, alpha: 0.35,
        duration: 300, yoyo: true, repeat: 4,
        onComplete: () => {
          this.tweens.add({
            targets: tip, y: y - 84, alpha: 0, duration: 180,
            onComplete: () => tip.destroy()
          });
        }
      });

      pushLog('⚠ 预警：第' + (row + 1) + '行即将出鸡');
    }

    /* ---------------- 新手引导 ---------------- */
    showStory() {
      this.paused = true;

      const items = [];
      const dim = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x5c4326, 0.45).setDepth(90);

      const card = this.add.graphics().setDepth(91);
      card.fillStyle(0x5c4326, 0.18);
      card.fillRoundedRect(258, 158, 776, 328, 30);
      card.fillStyle(0xfffdf6, 0.98);
      card.fillRoundedRect(252, 150, 776, 328, 30);
      card.lineStyle(3, 0xffcf5c, 1);
      card.strokeRoundedRect(252, 150, 776, 328, 30);

      const title = this.add.text(640, 202, '🌽 玉米村告急', {
        fontFamily: FONT, fontSize: '34px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(92);

      const body = this.add.text(640, 292, '公鸡军团来袭了！\n玉米村陷入危机，母鸡们需要你的指挥！', {
        fontFamily: FONT, fontSize: '25px', color: '#7b6650',
        align: 'center', lineSpacing: 14, wordWrap: { width: 640 }
      }).setOrigin(0.5).setDepth(92);

      const btnG = this.add.graphics().setDepth(92);
      btnG.fillStyle(0xffcf5c, 1);
      btnG.fillRoundedRect(520, 392, 240, 60, 30);

      const btnT = this.add.text(CANVAS_W / 2, CANVAS_H / 2 + 86, '开始保卫', {
        fontFamily: FONT, fontSize: '24px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(93);

      const hit = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2 + 86, 240, 60, 0xffffff, 0.001)
        .setDepth(94).setInteractive({ useHandCursor: true });

      items.push(dim, card, title, body, btnG, btnT, hit);

      hit.on('pointerdown', (p, x, y, ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
