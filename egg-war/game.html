        this.storyClosed = true;
        items.forEach((o) => { if (o && o.destroy) o.destroy(); });
        pushLog('📖 开场剧情已关闭');
        this.openDeck();
      });

      pushLog('📖 开场剧情弹出（游戏已暂停）');
    }

    showToast(text) {
      const t = this.add.text(640, 64, text, {
        fontFamily: FONT, fontSize: '22px', color: '#8a5a2b', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(60).setAlpha(0);

      this.tweens.add({ targets: t, alpha: 1, y: 80, duration: 380, ease: 'Cubic.easeOut' });
      this.time.delayedCall(2600, () => {
        this.tweens.add({
          targets: t, alpha: 0, y: 62, duration: 420, ease: 'Cubic.easeIn',
          onComplete: () => t.destroy()
        });
      });
    }

    burnAround(e) {
      let n = 0;
      const list = this.units.slice();
      for (const u of list) {
        if (u.removed) continue;
        if (Math.abs(u.row - e.row) > 1) continue;
        if (Math.abs(u.x - e.x) > 110) continue;
        this.damageUnit(u, e.burnDmg, e);
        n += 1;
      }
      if (!n) return;

      const ring = this.add.circle(e.x, e.y, 34, 0xffb066, 0.20)
        .setStrokeStyle(3, 0xff7a3c, 0.85).setDepth(26);
      this.tweens.add({ targets: ring, scale: 1.8, alpha: 0, duration: 320,
        onComplete: () => ring.destroy() });
    }

    /* ---------------- 光环：号角攻速 / 盾卫减伤 ---------------- */
    hasteFor(u) {
      for (const o of this.units) {
        if (o.removed || o.key !== 'horn') continue;
        if (Math.abs(o.row - u.row) <= 1 && Math.abs(o.col - u.col) <= 1) return o.haste || 0.8;
      }
      return 1;
    }

    shieldReduceFor(u) {
      for (const o of this.units) {
        if (o.removed || o.key !== 'shield') continue;
        if (Math.abs(o.row - u.row) <= 1 && Math.abs(o.col - u.col) <= 1) {
          return UNIT_DEFS.shield.shieldReduce;
        }
      }
      return 0;
    }

    chainLightning(u, first) {
      const def = UNIT_DEFS[u.key] || UNIT_DEFS.storm;
      const hit = [first];
      let last = first;

      for (let i = 0; i < def.chain; i++) {
        let next = null;
        for (const e of this.enemies) {
          if (hit.indexOf(e) >= 0) continue;
          const d = Math.abs(e.x - last.x) + Math.abs(e.row - last.row) * 60;
          if (d <= def.chainRange && (!next || d < Math.abs(next.x - last.x))) next = e;
        }
        if (!next) break;
        hit.push(next);
        last = next;
      }

      const g = this.add.graphics().setDepth(29);
      let prev = { x: u.x, y: u.y };
      hit.forEach((e) => {
        g.lineStyle(3, 0xd8b6ff, 0.9);
        g.lineBetween(prev.x, prev.y, e.x, e.y);
        g.lineStyle(1.5, 0xffffff, 0.85);
        g.lineBetween(prev.x, prev.y, e.x, e.y);
        prev = { x: e.x, y: e.y };
        this.damageEnemy(e, def.dmg);
      });

      this.tweens.add({ targets: g, alpha: 0, duration: 220, onComplete: () => g.destroy() });
      pushLog('⚡ 闪电母鸡连锁 ' + hit.length + ' 只');
    }

    /* ---------------- 开局选牌（卡组 10 只） ---------------- */
    deckStorageKey() { return 'eggwar_deck_v1'; }
    bestWaveKey() { return 'eggwar_best_wave_v1'; }

    loadDeck() {
      try {
        const raw = localStorage.getItem(this.deckStorageKey());
        if (!raw) return [];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        return arr.filter((k) => UNIT_DEFS[k]).slice(0, 10);
      } catch (e) { return []; }
    }

    saveDeck(arr) {
      try { localStorage.setItem(this.deckStorageKey(), JSON.stringify(arr)); } catch (e) { /* ignore */ }
    }

    unlockedWave() {
      const cur = this.waveIndex + 1;
      let best = 1;
      try { best = parseInt(localStorage.getItem(this.bestWaveKey()) || '1', 10) || 1; } catch (e) { /* ignore */ }
      return Math.max(cur, best, 1);
    }

    openDeck() {
      this.deckPicking = true;
      this.paused = true;
      this.selected = null;
      this.shovel = false;
      this.syncCards();
      this.syncTools();
      this.renderDeck();
      const el = document.getElementById('deck-screen');
      if (el) el.hidden = false;
    }

    closeDeck() {
      this.deckPicking = false;
      const el = document.getElementById('deck-screen');
      if (el) el.hidden = true;
    }

    renderDeck() {
      const grid = document.getElementById('deck-grid');
      const countEl = document.getElementById('deck-count');
      const startBtn = document.getElementById('deck-start');
      if (!grid) return;

      const unlocked = this.unlockedWave();
      const picked = this.deck || [];
      grid.innerHTML = '';

      Object.keys(UNIT_DEFS).forEach((key) => {
        const def = UNIT_DEFS[key];
        const need = def.unlock || 1;
        const locked = need > unlocked;
        const on = picked.indexOf(key) >= 0;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'deck-card' + (on ? ' sel' : '') + (locked ? ' lock' : '');
        btn.dataset.key = key;

        const ico = document.createElement('span');
        const look = UNIT_LOOK[key] || ['round', 'M'];
        ico.className = 'dc-ico shape-' + look[0];
        ico.style.background = '#' + def.color.toString(16).padStart(6, '0');

        const nm = document.createElement('span');
        nm.className = 'dc-name';
        nm.textContent = def.name;

        const cost = document.createElement('span');
        cost.className = 'dc-cost';
        cost.textContent = locked ? ('第 ' + need + ' 波解锁') : (def.cost + ' 玉米');

        btn.appendChild(ico);
        btn.appendChild(nm);
        btn.appendChild(cost);
        if (!locked) btn.addEventListener('click', () => this.toggleDeckPick(key));

        grid.appendChild(btn);
      });

      if (countEl) countEl.textContent = '已选 ' + picked.length + ' / 10';
      if (startBtn) startBtn.disabled = picked.length !== 10;
    }

    toggleDeckPick(key) {
      if (!this.deckPicking) return;
      const idx = this.deck.indexOf(key);
      if (idx >= 0) this.deck.splice(idx, 1);
      else if (this.deck.length < 10) this.deck.push(key);
      else this.showToast('卡组已满 10 只，先取消一只');
      this.renderDeck();
    }

    clearDeck() {
      if (!this.deckPicking) return;
      this.deck = [];
      this.renderDeck();
    }

    confirmDeck() {
      if (!this.deckPicking) return;
      if (this.deck.length !== 10) { this.showToast('请选满 10 只'); return; }

      this.saveDeck(this.deck);
      this.closeDeck();
      this.paused = false;
      this.state = 'PREPARING';
      this.buildCards();          // 只渲染这 10 只
      this.refreshHud();
      this.startPrep();
      this.showToast('卡组已就绪，布置母鸡军团！');
    }

    /* ---------------- 铲子（移除单位，返还 30% 费用） ---------------- */
    toggleShovel() {
      if (this.over || this.paused) return;
      this.shovel = !this.shovel;
      this.selected = null;      // 与卡牌互斥
      this.syncCards();
      this.syncTools();
      if (this.shovel) this.showToast('铲子已选中：点击场上单位即可移除');
    }

    digUnit(u) {
      const def = UNIT_DEFS[u.key] || { cost: 0, name: '单位' };
      const refund = Math.floor((def.cost || 0) * 0.3);

      this.shatter(u.x, u.y, 0xffe6a8, 7, 30);
      this.flash(u.x, u.y - 24, '返还 ' + refund + ' 玉米', '#c9842a');
      this.removeUnit(u);

      if (refund > 0) {
        this.corn += refund;
        this.refreshHud();
      }

      this.shovel = false;
      this.syncTools();
      this.syncCards();
      pushLog('🧹 铲除 ' + def.name + '，返还 ' + refund);
    }

    /* ---------------- 倍速 ---------------- */
    toggleSpeed() {
      if (this.over || this.paused) return;
      this.speedScale = this.speedScale === 1 ? 2 : 1;
      this.syncTools();
      this.showToast(this.speedScale === 2 ? '2 倍速' : '恢复 1 倍速');
    }

    syncTools() {
      const sh = document.getElementById('shovel-btn');
      const sp = document.getElementById('speed-btn');
      if (sh) sh.classList.toggle('sel', !!this.shovel);
      if (sp) {
        sp.textContent = (this.speedScale || 1) + '×';
        sp.classList.toggle('sel', (this.speedScale || 1) > 1);
      }
    }

    /* ---------------- 波次横幅 ---------------- */
    showWaveBanner(text, big) {
      const t = this.add.text(CANVAS_W / 2, 74, text, {
        fontFamily: FONT, fontSize: big ? '34px' : '26px',
        color: '#b35a1f', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(72).setAlpha(0).setScale(0.86)
        .setShadow(0, 2, '#ffffff', 10);

      this.tweens.add({ targets: t, alpha: 1, scale: 1, duration: 260, ease: 'Back.easeOut' });
      this.time.delayedCall(1500, () => {
        this.tweens.add({
          targets: t, alpha: 0, y: 52, duration: 420, ease: 'Cubic.easeIn',
          onComplete: () => t.destroy()
        });
      });
    }

    /* ---------------- 卡槽种植冷却 ---------------- */
    startCardCooldown(key) {
      const secs = PLANT_CD[key] || 0;
      if (secs <= 0) return;
      this.plantCd[key] = secs;
      this.renderCardCooldown(key, secs, secs);
      this.syncCards();
    }

    renderCardCooldown(key, left, total) {
      const bar = document.getElementById('card-bar');
      if (!bar) return;
      const btn = bar.querySelector('.card[data-key="' + key + '"]');
      if (!btn) return;

      const mask = btn.querySelector('.card-mask');
      const txt = btn.querySelector('.card-cd');
      const frac = Math.max(0, Math.min(1, left / (total || 1)));

      if (mask) mask.style.height = (frac * 100).toFixed(1) + '%';
      if (txt) txt.textContent = left > 0 ? left.toFixed(1) + 's' : '';
    }

    updateCardCooldowns(dt) {
      const keys = Object.keys(this.plantCd);
      let anyFinished = false;

      for (let i = 0; i < keys.length; i++) {
        const key = keys[i];
        const left = this.plantCd[key];
        if (left <= 0) continue;

        const total = PLANT_CD[key] || 1;
        const next = Math.max(0, left - dt);
        this.plantCd[key] = next;
        this.renderCardCooldown(key, next, total);

        if (next <= 0) {
          anyFinished = true;
          const bar = document.getElementById('card-bar');
          const btn = bar && bar.querySelector('.card[data-key="' + key + '"]');
          if (btn) {
            btn.classList.remove('cooling', 'locked');
            btn.classList.add('glow');
            setTimeout(function () { btn.classList.remove('glow'); }, 480);
          }
        }
      }

      if (anyFinished) this.syncCards();
    }

    /* ---------------- 波次系统 ---------------- */
    buildQueue(cfg) {
      const list = [];
      Object.keys(cfg).forEach((k) => {
        if (k === 'interval' || k === 'prep' || k === 'boss') return;
        const n = cfg[k] || 0;
        for (let i = 0; i < n; i++) list.push(k);
      });

      // 打乱（巨型留在最后，避免开局撞 BOSS）
      const normalish = list.filter((k) => k !== 'giant');
      const bosses = list.filter((k) => k === 'giant');
      for (let i = normalish.length - 1; i > 0; i--) {
        const j = Phaser.Math.Between(0, i);
        const t = normalish[i]; normalish[i] = normalish[j]; normalish[j] = t;
      }
      return normalish.concat(bosses);
    }

    startPrep() {
      const cfg = WAVES[this.waveIndex];
      try {
        const best = parseInt(localStorage.getItem(this.bestWaveKey()) || '1', 10) || 1;
        if (this.waveIndex + 1 > best) localStorage.setItem(this.bestWaveKey(), String(this.waveIndex + 1));
      } catch (e) { /* ignore */ }
      this.state = 'PREPARING';
      this.over = false;
      this.paused = false;
      this.prepLeft = cfg.prep;
      this.pendingRow = null;
      this.spawnTimer = 0;
      this.waveQueue = this.buildQueue(cfg);

      this.setPrepLine('第 ' + (this.waveIndex + 1) + ' 波 · 准备 ' + Math.ceil(this.prepLeft) + 's');
      pushLog('📦 第 ' + (this.waveIndex + 1) + ' 波准备 · 敌方 ' + this.waveQueue.length + ' 只');
    }

    startFighting() {
      this.state = 'FIGHTING';
      this.spawnTimer = 0.8;
      this.setPrepLine(null);
      this.showWaveBanner('一大波公鸡来袭！', this.waveIndex >= 3);   // 第 4/5 波放大字号
      pushLog('⚔ 第 ' + (this.waveIndex + 1) + ' 波开战！');
    }

    updateSpawner(dt) {
      if (!this.waveQueue.length) return;

      this.spawnTimer -= dt;
      if (this.pendingRow === null && this.spawnTimer <= 3) {
        this.pendingRow = Phaser.Math.Between(0, G.rows - 1);
        this.showSpawnWarning(this.pendingRow);
      }

      if (this.spawnTimer <= 0) {
        const type = this.waveQueue.shift();
        this.spawnEnemy(this.pendingRow, type);
        this.pendingRow = null;
        this.spawnTimer = WAVES[this.waveIndex].interval;
      }
    }

    checkWaveClear() {
      if (this.over || this.state !== 'FIGHTING') return;
      if (this.waveQueue.length > 0) return;
      if (this.enemies.length > 0) return;

      this.state = 'WIN';
      this.paused = true;               // 冻结主循环，防止结算时还在跑
      const last = this.waveIndex >= WAVES.length - 1;
      pushLog(last ? '🏆 第 5 波清空，全部通关' : '🎉 第 ' + (this.waveIndex + 1) + ' 波清空');

      this.showEndModal({
        title: last ? '🏆 玉米村保卫战大获全胜！' : '🎉 胜利！',
        body: last ? '公鸡军团彻底撤退，玉米村安全了！' : '公鸡军团暂时撤退了。',
        button: last ? '再玩一局' : '进入第 ' + (this.waveIndex + 2) + ' 波',
        onClose: last ? null : () => {
          this.waveIndex += 1;
          this.startPrep();             // 切回准备阶段 15 秒
        }
      });
    }

    showEndModal(opts) {
      this.over = true;
      this.paused = true;
      this.selected = null;
      this.syncCards();
      if (this.hoverCell) this.hoverCell.setVisible(false);
      this.setPrepLine(null);

      const items = [];
      const dim = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x5c4326, 0.55).setDepth(100);

      const card = this.add.graphics().setDepth(101);
      card.fillStyle(0xfffdf6, 0.98);
      const cardW = Math.min(640, CANVAS_W - 80);
      const cardH = 316;
      const cardX = CANVAS_W / 2 - cardW / 2;
      const cardY = CANVAS_H / 2 - cardH / 2;
      card.fillRoundedRect(cardX, cardY, cardW, cardH, 28);
      card.lineStyle(3, 0xffcf5c, 1);
      card.strokeRoundedRect(cardX, cardY, cardW, cardH, 28);

      const title = this.add.text(640, 232, opts.title, {
        fontFamily: FONT, fontSize: '33px', color: '#5c4326', fontStyle: 'bold',
        align: 'center', wordWrap: { width: 580 }
      }).setOrigin(0.5).setDepth(102);

      const body = this.add.text(640, 320, opts.body, {
        fontFamily: FONT, fontSize: '24px', color: '#7b6650', align: 'center',
        wordWrap: { width: 560 }, lineSpacing: 10
      }).setOrigin(0.5).setDepth(102);

      const btnG = this.add.graphics().setDepth(102);
      btnG.fillStyle(0xffcf5c, 1);
      btnG.fillRoundedRect(510, 390, 260, 60, 30);

      const btnT = this.add.text(640, 420, opts.button, {
        fontFamily: FONT, fontSize: '24px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(103);

      const hit = this.add.rectangle(640, 420, 260, 60, 0xffffff, 0.001)
        .setDepth(104).setInteractive({ useHandCursor: true });

      items.push(dim, card, title, body, btnG, btnT, hit);

      // 失败时提供「重新选牌」
      if (opts.secondary) {
        const btn2 = this.add.graphics().setDepth(102);
        btn2.fillStyle(0xfff3d8, 1);
        btn2.fillRoundedRect(430, 466, 180, 46, 23);
        btn2.lineStyle(2, 0xffcf5c, 1);
        btn2.strokeRoundedRect(430, 466, 180, 46, 23);

        const t2 = this.add.text(520, 489, opts.secondary.label, {
          fontFamily: FONT, fontSize: '19px', color: '#6b4a22', fontStyle: 'bold'
        }).setOrigin(0.5).setDepth(103);

        const h2 = this.add.rectangle(520, 489, 180, 46, 0xffffff, 0.001)
          .setDepth(104).setInteractive({ useHandCursor: true });

        h2.on('pointerdown', (p, x, y, ev) => {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          items.forEach((o) => { if (o && o.destroy) o.destroy(); });
          t2.destroy(); h2.destroy(); btn2.destroy();
          opts.secondary.onClick();
        });

        items.push(btn2, t2, h2);
      }

      hit.on('pointerdown', (p, x, y, ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        items.forEach((o) => { if (o && o.destroy) o.destroy(); });
        if (opts.onClose) {
          this.over = false;
          this.paused = false;
          opts.onClose();
        } else {
          this.scene.restart();
        }
      });
    }

    /* ---------------- 帧更新 ---------------- */
    update(time, delta) {
      if (this.over || this.paused) return;
      const dt = (Math.min(delta, 120) / 1000) * (this.speedScale || 1);
      this.clock += dt;

      // 状态机：准备 / 战斗
      if (this.state === 'PREPARING') {
        this.prepLeft -= dt;
        this.setPrepLine('第 ' + (this.waveIndex + 1) + ' 波 · 准备 ' +
          Math.ceil(Math.max(0, this.prepLeft)) + 's');
        if (this.prepLeft <= 0) this.startFighting();
      } else if (this.state === 'FIGHTING') {
        this.updateSpawner(dt);
        this.updateCardCooldowns(dt);   // 准备阶段/弹窗/结算时冻结
      }

      // 天上掉玉米粒：频率小幅提高（2.6~4.2 秒一颗）
      this.timers.corn -= dt;
      if (this.timers.corn <= 0) {
        this.dropSkyCorn();
        this.timers.corn = 2.6 + Math.random() * 1.6;
      }

      this.updateUnits(dt);
      this.updateEnemies(dt);
      this.updateBullets(dt);
      this.updateDrops(dt);

      // 本波清空判定：存活 0 且待刷队列 0
      this.checkWaveClear();
    }

    updateUnits(dt) {
      for (const u of this.units.slice()) {
        if (u.removed) continue;
        this.syncBar(u.bar, dt, u.x, u.barY);

        // 待机轻微上下浮动，让画面有呼吸感
        u.body.y = u.y + Math.sin(this.clock * 2.2 + u.phase) * 1.6;

        // 中毒持续伤害（每只单位独立计时，不串台）
        if (u.venomT > 0) {
          u.venomT -= dt;
          u.hp -= u.venomDps * dt;
          this.setBarTarget(u.bar, Math.max(0, u.hp), u.maxHp);
          if (u.hp <= 0) { this.damageUnit(u, 0.01, null); continue; }
        }

        const haste = this.hasteFor(u);

        if (u.key === 'sniper') {
          u.cd -= dt * haste;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            if (this.nearestEnemyAhead(u)) {
              this.fireBullet(u);
              u.cd = 1.2;
            } else {
              u.cd = 0;
            }
          }
        } else if (u.key === 'hen') {
          u.cd -= dt;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            this.dropHenCorn(u);
            u.cd = 5;
          }
        } else if (u.key === 'gunner') {
          u.cd -= dt * haste;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            const target = this.nearestEnemyInRange(u, G.cell * 3);
            if (target) {
              this.fireBullet(u, 10, 640, 6);
              u.cd = 0.6;
            } else {
              u.cd = 0;
            }
          }
        } else if (u.key === 'ice') {
          u.cd -= dt * haste;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            const tgt = this.nearestEnemyAhead(u);
            if (tgt) {
              this.fireBullet(u, UNIT_DEFS.ice.dmg, 470, 8, { slow: UNIT_DEFS.ice.slow, slowTime: UNIT_DEFS.ice.slowTime });
              u.cd = UNIT_DEFS.ice.atkCd;
            } else { u.cd = 0; }
          }
        } else if (u.key === 'storm') {
          u.cd -= dt * haste;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            const tgt = this.nearestEnemyAhead(u);
            if (tgt) { this.chainLightning(u, tgt); u.cd = UNIT_DEFS.storm.atkCd; }
            else { u.cd = 0; }
          }
        } else if (u.key === 'cannon') {
          u.cd -= dt * haste;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            const tgt = this.nearestEnemyAhead(u);
            if (tgt) { this.fireBullet(u, UNIT_DEFS.cannon.dmg, 540, 10); u.cd = UNIT_DEFS.cannon.atkCd; }
            else { u.cd = 0; }
          }
        } else if (u.key === 'healer') {
          u.cd -= dt;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            u.cd = 3;
            this.healAround(u, 10);
          }
        } else if (u.key === 'bomber') {
          const near = this.enemies.find((e) =>
            e.row === u.row && Math.abs(e.x - u.x) <= 118
          );
          if (near) this.detonate(u);
        } else if (u.key === 'charger') {
          u.x += u.dashSpeed * dt;
          u.body.x = u.x;

          let hit = null;
          for (const e of this.enemies) {
            if (e.row !== u.row) continue;
            if (Math.abs(e.x - u.x) <= 42) { hit = e; break; }
          }

          if (hit) {
            this.damageEnemy(hit, 120);
            this.chargeBurst(u);
            this.removeUnit(u);
          } else if (u.x >= u.dashEnd) {
            this.chargeBurst(u);
            this.removeUnit(u);
          }
        } else if (u.ai === 'ranged') {
          const def = UNIT_DEFS[u.key];
          u.cd -= dt * haste;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            const rng = def.range ? def.range * G.cell : 99999;
            const tgt = this.nearestEnemyInRange(u, rng);
            if (tgt) {
              this.fireBullet(u, def.dmg, 500, def.slow ? 8 : 7,
                def.slow ? { slow: def.slow, slowTime: def.slowTime } : null);
              u.cd = def.atkCd;
            } else { u.cd = 0; }
          }
        } else if (u.ai === 'chain') {
          const def = UNIT_DEFS[u.key];
          u.cd -= dt * haste;
          this.updateCdLabel(u);
          if (u.cd <= 0) {
            const tgt = this.nearestEnemyAhead(u);
            if (tgt) { this.chainLightning(u, tgt); u.cd = def.atkCd; }
            else { u.cd = 0; }
          }
        } else if (u.ai === 'economy') {
          const def = UNIT_DEFS[u.key];
          u.cd -= dt;
          this.updateCdLabel(u);
          if (u.cd <= 0) { this.dropHenCorn(u); u.cd = def.cycle || 5; }
        } else if (u.ai === 'healer') {
          const def = UNIT_DEFS[u.key];
          u.cd -= dt;
          this.updateCdLabel(u);
          if (u.cd <= 0) { u.cd = def.cycle || 3; this.healAround(u, def.heal || 10); }
        } else if (u.ai === 'bomber') {
          const def = UNIT_DEFS[u.key];
          const near = this.enemies.find((e) =>
            e.row === u.row && Math.abs(e.x - u.x) <= 118
          );
          if (near) this.detonate(u, def.blast || 140);
        } else if (u.ai === 'charger') {
          const def = UNIT_DEFS[u.key];
          u.x += u.dashSpeed * dt;
          u.body.x = u.x;
          let hit2 = null;
          for (const e of this.enemies) {
            if (e.row !== u.row) continue;
            if (Math.abs(e.x - u.x) <= 42) { hit2 = e; break; }
          }
          if (hit2) {
            this.damageEnemy(hit2, def.dashDmg || 120);
            this.chargeBurst(u);
            this.removeUnit(u);
          } else if (u.x >= u.dashEnd) {
            this.chargeBurst(u);
            this.removeUnit(u);
          }
        }
      }
    }

    updateEnemies(dt) {
      for (const e of this.enemies.slice()) {
        this.syncBar(e.bar, dt, e.x, e.barY);

        // 召唤公鸡：周期性放出一只疾风小公鸡
        if (e.summonEvery) {
          e.summonLeft -= dt;
          if (e.summonLeft <= 0) {
            e.summonLeft = e.summonEvery;
            this.spawnEnemy(e.row, e.summonType, Math.min(CANVAS_W - 36, e.x + 34));
          }
        }

        // 喷火公鸡：周期性灼烧相邻格的我方单位
        if (e.burnDmg) {
          e.burnLeft -= dt;
          if (e.burnLeft <= 0) {
            e.burnLeft = e.burnCd || 1.5;
            this.burnAround(e);
          }
        }

        // 飞行公鸡：越过前排，不被单位阻挡
        const blocker = e.flying ? null : this.findBlocker(e);
        if (blocker) {
          e.body.angle = 0;
          e.attackCd -= dt;
          if (e.attackCd <= 0) {
            e.attackCd = e.peckRate;
            this.damageUnit(blocker, e.peckDmg, e);
            if (e.poisonDmg && !blocker.removed) {
              blocker.venomT = 3;
              blocker.venomDps = e.poisonDmg;
            }
            e.peckCount += 1;
            if (e.shockEvery && e.peckCount % e.shockEvery === 0) this.giantShock(e);
            if (this.over || !e.body.active) continue;
            this.tweens.add({
              targets: e.body, x: e.x - 9, duration: 85, yoyo: true,
              onComplete: () => { if (e.body.active) e.body.x = e.x; }
            });
          }
        } else if (e.x > G.x0 + 34) {
          if (e.slowT > 0) e.slowT -= dt;
          const slowMul = e.slowT > 0 ? (e.slowFactor || 0.55) : 1;
          const rageMul = e.rage ? 1 + (1 - e.hp / e.maxHp) * 0.8 : 1;   // 狂暴：越残血越快
          e.x -= (e.speed || ENEMY.speed) * dt * slowMul * rageMul;
          this.syncEnemy(e);

          // 走路时左右轻摆
          e.walkPhase += dt * 9;
          e.body.angle = Math.sin(e.walkPhase) * 2.6;

          if (e.x <= G.x0 + 34) {
            e.x = G.x0 + 34;
            this.syncEnemy(e);
          }
        } else {
          // 走到鸡窝：开始啃基地
          e.body.angle = 0;
          e.attackCd -= dt;
          if (e.attackCd <= 0) {
            e.attackCd = BASE.peckRate;
            e.peckCount += 1;
            this.damageBase(e.peckDmg || BASE.peckDmg);
            this.tweens.add({
              targets: e.body, x: e.x + 7, duration: 80, yoyo: true,
              onComplete: () => { if (e.body.active) e.body.x = e.x; }
            });
            if (e.shockEvery && e.peckCount % e.shockEvery === 0) this.giantShock(e);
            if (this.over) return;
          }
        }
      }
    }

    updateBullets(dt) {
      for (const b of this.bullets.slice()) {
        b.x += b.speed * dt;
        b.t += dt;

        const pulse = 1 + 0.12 * Math.sin(b.t * 20);
        b.core.setPosition(b.x, b.y).setScale(pulse);
        b.glow.setPosition(b.x, b.y).setScale(1 + 0.16 * Math.sin(b.t * 20 + 1.1));

        let hit = null;
        for (const e of this.enemies) {
          if (e.row !== b.row) continue;
          if (Math.abs(e.x - b.x) <= 34) { hit = e; break; }
        }

        if (hit) {
          if (b.slow > 0) {
            hit.slowT = b.slowTime * (1 - (hit.slowResist || 0));
            hit.slowFactor = b.slow;
            const ring = this.add.circle(hit.x, hit.y, 26, 0xbfe6ff, 0.28)
              .setStrokeStyle(3, 0x7fc4f0, 0.9).setDepth(24);
            this.tweens.add({ targets: ring, scale: 1.7, alpha: 0, duration: 260,
              onComplete: () => ring.destroy() });
          }
          this.damageEnemy(hit, b.dmg);
          this.removeBullet(b);
        } else if (b.x > CANVAS_W + 20) {
          this.removeBullet(b);
        }
      }
    }

    updateDrops(dt) {
      for (const d of this.drops.slice()) {
        d.life -= dt;

        // 呼吸光晕：始终轻微起伏，帮助玩家一眼看到
        const breath = Math.sin(this.clock * 2.4 + d.phase);
        d.glow.setScale(1 + 0.14 * breath);
        d.glow.setAlpha(0.16 + 0.10 * (0.5 + 0.5 * breath));

        if (!d.landed) {
          d.vy = Math.min(320, d.vy + 900 * dt);
          d.y = Math.min(d.targetY, d.y + d.vy * dt);
          d.phase += dt * 6;
          const sway = Math.sin(d.phase) * 3;
          d.main.setPosition(d.x + sway, d.y);
          d.hi.setPosition(d.x + sway - 5, d.y - 5);
          d.glow.setPosition(d.x + sway, d.y);

          if (d.y >= d.targetY) {
            d.landed = true;
            d.settling = true;
            d.autoLeft = AUTO_COLLECT_DELAY;   // 落地 → 开始停留倒计时
            this.tweens.add({
              targets: d.main, scaleX: 1.15, scaleY: 0.86, duration: 90, yoyo: true,
              onComplete: () => { d.main.setScale(1); d.settling = false; }
            });
          }
        } else {
          if (!d.settling) {
            const b = 1 + Math.sin(d.life * 4) * 0.04;
            d.main.setScale(b);
          }
          d.glow.setPosition(d.x, d.y);

          // 自动收起：停留倒计时走完 → 走与手动点击相同的 collectOne
          if (d.autoLeft !== null && d.alive &&
              this.state === 'FIGHTING' && !this.paused && !this.over) {
            d.autoLeft -= dt;
            if (d.autoLeft <= 0) {
              this.collectOne(d);   // +25 / 飞行 / pulseCorn / 日志 全部复用
              continue;
            }
          }
        }

        if (d.life <= 2) {
          const a = 0.3 + 0.7 * Math.abs(Math.sin(d.life * 6));
          d.main.setAlpha(a);
          d.hi.setAlpha(a);
        }
        if (d.life <= 0) {
          d.alive = false;
          this.drops = this.drops.filter((x) => x !== d);
          this.tweens.add({
            targets: [d.main, d.hi, d.glow], scale: 0.2, alpha: 0,
            duration: 160,
            onComplete: () => { d.main.destroy(); d.hi.destroy(); d.glow.destroy(); }
          });
        }
      }
    }

    /* ---------------- 结束 ---------------- */
    gameOver() {
      if (this.over) return;
      this.state = 'LOSE';
      pushLog('🚨 鸡窝被啃空，玉米村失守');
      this.showEndModal({
        title: '💧 玉米村失守了……',
        body: '再试一次吧！',
        button: '沿用卡组再战',
        onClose: () => {
          this.game.registry.set('quickDeck', true);
          this.scene.restart();
        },
        secondary: {
          label: '重新选牌',
          onClick: () => {
            try { localStorage.removeItem('eggwar_deck_v1'); } catch (e) { /* ignore */ }
            this.scene.restart();
          }
        }
      });
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: CANVAS_W,
    height: CANVAS_H,
    parent: 'game',
    backgroundColor: '#fff8ec',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: [GameScene]
  };

  window.__eggGame = new Phaser.Game(config);


  /* ---------------- 玩法工具按钮绑定 ---------------- */
  const shovelEl = document.getElementById('shovel-btn');
  const speedEl = document.getElementById('speed-btn');

  if (shovelEl) {
    shovelEl.addEventListener('click', () => {
      if (activeScene) activeScene.toggleShovel();
    });
  }

  if (speedEl) {
    speedEl.addEventListener('click', () => {
      if (activeScene) activeScene.toggleSpeed();
    });
  }

  // 横竖屏切换：画布尺寸在启动时锁定，旋转后重载以重排布局
  let lastPortrait = window.innerWidth <= window.innerHeight;
  window.addEventListener('resize', () => {
    const nowPortrait = window.innerWidth <= window.innerHeight;
    if (nowPortrait !== lastPortrait) {
      lastPortrait = nowPortrait;
      clearTimeout(window.__eggRotateT);
      window.__eggRotateT = setTimeout(() => location.reload(), 220);
    }
  });

  const deckClearEl = document.getElementById('deck-clear');
  const deckStartEl = document.getElementById('deck-start');

  if (deckClearEl) {
    deckClearEl.addEventListener('click', () => {
      if (activeScene) activeScene.clearDeck();
    });
  }

  if (deckStartEl) {
    deckStartEl.addEventListener('click', () => {
      if (activeScene) activeScene.confirmDeck();
    });
  }
}
})();
</script>
