<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>母鸡大战公鸡</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #fff8ec 0%, #ffefd5 55%, #d8f3e3 100%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --band-top: 56px;
    --band-bottom: 172px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (min-width: 700px) {
    :root { --band-bottom: 96px; }
  }

  /* 顶部信息栏：独立绝对层，不参与画布布局 */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--band-top);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 0 12px;
    z-index: 6;
    background: linear-gradient(180deg, #fff8ec 0%, #fff2dc 100%);
    border-bottom: 1px solid rgba(255, 224, 168, 0.9);
    box-shadow: 0 6px 16px -14px rgba(122, 86, 44, 0.7);
  }
  .hud-title {
    margin: 0; font-size: clamp(16px, 2.6vw, 26px); line-height: 1.1;
    color: #5c4326; letter-spacing: 0.04em; font-weight: 800;
    white-space: nowrap;
    text-shadow: 0 2px 0 #ffffff, 0 8px 16px rgba(196, 142, 63, 0.18);
  }
  .hud-mid { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
  .hud-prep { font-size: 14px; font-weight: 700; color: #b35a1f; white-space: nowrap; }
  .hud-prep[hidden] { display: none; }
  .hud-corn { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .corn-dot {
    width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 34% 32%, #fff3c4, #ffcf5c 55%, #e8a92c 100%);
    box-shadow: 0 2px 6px -2px rgba(154, 111, 42, 0.7);
  }
  .corn-label { font-size: 13px; color: #7b6650; }
  #corn-val { font-size: 22px; color: #c9842a; line-height: 1; display: inline-block; }
  #corn-val.pulse { animation: cornPop 0.3s ease; }
  @keyframes cornPop { 0% { transform: scale(1); } 45% { transform: scale(1.22); } 100% { transform: scale(1); } }

  /* 底部卡牌栏：独立绝对层 + 底部安全区 */
  #card-dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(var(--band-bottom) + var(--safe-bottom));
    padding: 8px 10px calc(8px + var(--safe-bottom));
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
    background: linear-gradient(180deg, #fff8ec 0%, #fff6e2 45%, #ffefd5 100%);
    border-top: 1px solid rgba(255, 224, 168, 0.9);
    box-shadow: 0 -10px 20px -18px rgba(122, 86, 44, 0.9);
  }

  /* 中间战场：固定在两条栏之间，画布等比填充，不被栏内容挤压 */
  #game {
    position: fixed; left: 0; right: 0;
    top: var(--band-top);
    bottom: calc(var(--band-bottom) + var(--safe-bottom));
    z-index: 1;
  }

  .card-bar {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 104px));
    gap: 8px 10px;
    justify-content: center;
    width: 100%;
  }
  @media (min-width: 700px) {
    .card-bar { grid-template-columns: repeat(8, minmax(0, 104px)); gap: 8px; }
  }
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; text-align: center;
    height: 74px; padding: 4px 4px; overflow: hidden;
    border-radius: 18px; border: 2px solid #ffe0a8;
    background: linear-gradient(180deg, #fffdf8, #fff6e2);
    color: #5c4326; font-family: inherit;
    box-shadow: 0 10px 18px -12px rgba(92, 67, 38, 0.9), 0 3px 8px -5px rgba(92, 67, 38, 0.25), inset 0 1px 0 #ffffff;
    transition: transform 0.18s ease, box-shadow 0.22s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: translateY(1px) scale(0.985); }
  .card.sel {
    border-color: #ffb63c;
    background: linear-gradient(180deg, #fff7de, #ffedc4);
    box-shadow: 0 0 0 4px rgba(255, 207, 92, 0.26), 0 12px 22px -12px rgba(154, 111, 42, 0.9), inset 0 1px 0 #ffffff;
    transform: translateY(-2px);
  }
  .card.off { opacity: 0.55; filter: saturate(0.7); }
  .card-ico {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 2px 6px -3px rgba(0, 0, 0, 0.35);
  }
  .card-txt {
    display: flex; flex-direction: column; align-items: center;
    gap: 1px; width: 100%; min-width: 0; overflow: hidden;
  }
  .card-txt b {
    font-size: 12px; line-height: 1.08; font-weight: 700;
    white-space: normal; word-break: break-all;
    overflow: hidden; text-overflow: clip;
  }
  .card-txt i {
    font-style: normal; font-size: 10px; line-height: 1.08; color: #c9842a;
    white-space: normal;
    overflow: hidden; text-overflow: clip;
  }
  @media (max-width: 380px) {
    .card-txt b { font-size: 11px; }
    .card-txt i { font-size: 9px; }
  }
    canvas { display: block; }

  #boot-msg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #8a7256;
    font: 16px/1.7 "Noto Sans SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
    white-space: pre-line;
  }

  /* ---------------- 调试面板 ---------------- */
  #dbg-wrap {
    position: fixed;
    right: 10px;
    bottom: calc(var(--band-bottom) + var(--safe-bottom) + 10px);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }
  #dbg-wrap > * { pointer-events: auto; }

  #dbg-toggle {
    width: 46px;
    height: 46px;
    border-radius: 15px;
    border: 2px solid #ffcf5c;
    background: linear-gradient(180deg, #fffdf6 0%, #ffe9b8 100%);
    color: #9a6f2a;
    font-size: 19px;
    line-height: 1;
    box-shadow: 0 8px 18px -8px rgba(154, 111, 42, 0.55), inset 0 1px 0 #ffffff;
    transition: transform 0.2s ease, box-shadow 0.25s ease;
  }
  #dbg-toggle:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 4px 10px -6px rgba(154, 111, 42, 0.5), inset 0 1px 0 #ffffff;
  }
  @media (hover: hover) {
    #dbg-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -10px rgba(154, 111, 42, 0.6), 0 0 0 5px rgba(255, 207, 92, 0.22), inset 0 1px 0 #ffffff;
    }
  }
  #dbg-panel {
    display: none;
    width: min(70vw, 264px);
    padding: 8px;
    border-radius: 14px;
    border: 1px solid #ffe0a8;
    background: rgba(255, 253, 248, 0.97);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    color: #5c4326;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  #dbg-panel.open { display: block; }

  .dbg-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: #9a6f2a;
    padding: 2px 2px 6px;
  }
  #dbg-hide {
    border: 0;
    background: transparent;
    color: #b08a5a;
    font-size: 17px;
    line-height: 1;
    padding: 0 4px;
  }
  .dbg-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .dbg-btn {
    flex: 1;
    min-height: 34px;
    border-radius: 9px;
    border: 1px solid #ffcf5c;
    background: #fff3d8;
    color: #6b4a22;
    font-size: 12.5px;
    font-family: inherit;
    padding: 4px 6px;
  }
  .dbg-btn:active { background: #ffe9b8; }
  .dbg-btn.dbg-warn {
    border-color: #ffb08a;
    background: #ffe6da;
    color: #a8451f;
  }
  .dbg-input {
    flex: 1;
    min-width: 0;
    min-height: 34px;
    border-radius: 9px;
    border: 1px solid #ffcf5c;
    background: #fffdf6;
    color: #a8651f;
    font-size: 16px;
    text-align: center;
    font-family: inherit;
  }
  #dbg-log {
    max-height: 118px;
    overflow-y: auto;
    padding: 6px 7px;
    border-radius: 10px;
    background: rgba(255, 246, 226, 0.92);
    border: 1px solid rgba(224, 161, 47, 0.35);
    font: 11.5px/1.55 ui-monospace, Menlo, Consolas, monospace;
    color: #7b6650;
    -webkit-overflow-scrolling: touch;
  }
  .dbg-line { white-space: normal; word-break: break-all; }
  .dbg-line.time { color: #b59468; }
</style>
</head>
<body>

<div id="hud">
  <h1 class="hud-title">母鸡大战公鸡</h1>
  <div class="hud-mid">
    <div class="hud-prep" id="prep-line" hidden>安全准备 15s</div>
  </div>
  <div class="hud-corn">
    <span class="corn-dot"></span>
    <span class="corn-label">玉米粒</span>
    <b id="corn-val">50</b>
  </div>
</div>

<div id="game"></div>

<div id="card-dock">
  <div class="card-bar" id="card-bar"></div>
</div>

<div id="boot-msg">正在加载 Phaser 3 …</div>

<!-- 调试后台面板（默认折叠） -->
<div id="dbg-wrap">
  <button id="dbg-toggle" aria-label="调试后台">⚙</button>
  <div id="dbg-panel">
    <div class="dbg-hd">
      <span>调试后台</span>
      <button id="dbg-hide" aria-label="收起">×</button>
    </div>
    <div class="dbg-row">
      <button id="dbg-pause" class="dbg-btn">⏸ 暂停</button>
      <button id="dbg-spawn" class="dbg-btn">🦃 刷公鸡</button>
    </div>
    <div class="dbg-row">
      <input id="dbg-corn" class="dbg-input" type="number" min="0" step="25" value="50" inputmode="numeric">
      <button id="dbg-corn-set" class="dbg-btn">设定玉米粒</button>
    </div>
    <div class="dbg-row">
      <button id="dbg-clear" class="dbg-btn dbg-warn">🧹 清空场上单位</button>
    </div>
    <div id="dbg-log"></div>
  </div>
</div>

<script>
'use strict';

/* ================= Phaser CDN 多源加载 ================= */
(function () {
  const CDNS = [
    './phaser.min.js',
    'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
    'https://lib.baomitu.com/phaser/3.80.1/phaser.min.js',
    'https://cdn.staticfile.net/phaser/3.80.1/phaser.min.js',
    'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js'
  ];
  const msg = document.getElementById('boot-msg');
  let i = 0;

  function next() {
    if (i >= CDNS.length) {
      msg.textContent = 'Phaser 加载失败：所有 CDN 都连不上。\n请检查网络后刷新页面。';
      return;
    }
    const s = document.createElement('script');
    s.src = CDNS[i++];
    s.onload = function () {
      if (window.Phaser) {
        msg.style.display = 'none';
        bootGame();
      } else {
        next();
      }
    };
    s.onerror = function () { next(); };
    document.head.appendChild(s);
  }

  next();
})();

/* ================= 游戏本体 ================= */
function bootGame() {
  const CANVAS_W = 1280;
  const CANVAS_H = 672;

  // 5 行 × 9 列草坪（数值不动）
  const G = { x0: 100, y0: 20, cell: 120, cols: 9, rows: 5 };
  const GRID_W = G.cols * G.cell; // 1080
  const GRID_H = G.rows * G.cell; // 600

  const FONT = '"Yuanti SC", "YouYuan", "M PLUS Rounded 1c", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';

  const cellX = (col) => G.x0 + col * G.cell + G.cell / 2;
  const cellY = (row) => G.y0 + row * G.cell + G.cell / 2;

  /* 玩家单位（数值不动） */
  const UNIT_DEFS = {
    hen: { name: '母鸡', cost: 50, hp: 320, size: 84, color: 0xffc93c },
    sniper: { name: '小鸡狙击手', cost: 100, hp: 220, size: 76, color: 0xffd8a8 },
    rock: { name: '石头蛋', cost: 50, hp: 1500, size: 92, color: 0xe8edf2 },
    charger: { name: '冲锋小鸡', cost: 60, hp: 150, size: 84, color: 0x7fc4f0 },
    healer: { name: '治愈母鸡', cost: 120, hp: 280, size: 84, color: 0xffb3d1 },
    bomber: { name: '炸弹小鸡', cost: 130, hp: 200, size: 84, color: 0x4a4a5a },
    gunner: { name: '高速连发鸡', cost: 75, hp: 200, size: 84, color: 0x8fd6b4 },
    reflector: { name: '重甲反伤母鸡', cost: 150, hp: 3000, size: 92, color: 0xb9a7d9 }
  };

  /* 鸡窝基地：有血量，被啃空才算失守 */
  const BASE = {
    hp: 300,
    peckDmg: 12,
    peckRate: 0.9
  };

  const PREP_TIME = 15;   // 每波准备时间（秒）

  // 波次配置：改这里就能调难度
  const WAVES = [
    { normal: 5,  raider: 0, giant: 0, interval: 4.0, prep: PREP_TIME },
    { normal: 8,  raider: 2, giant: 0, interval: 3.5, prep: PREP_TIME },
    { normal: 10, raider: 4, giant: 0, interval: 3.0, prep: PREP_TIME },
    { normal: 12, raider: 6, giant: 1, interval: 2.5, prep: PREP_TIME },
    { normal: 15, raider: 8, giant: 2, interval: 2.0, prep: PREP_TIME, boss: true }
  ];

  /* 敌方（数值不动） */
  const ENEMY_TYPES = {
    normal: {
      name: '大公鸡', hp: 260, w: 70, h: 82, speed: 26,
      peckDmg: 30, peckRate: 0.9,
      body: 0xff7a59, light: 0xffa88c, line: 0xe0674a, comb: 0xe53935, tail: 0xd93b2b
    },
    raider: {
      name: '突袭公鸡', hp: 150, w: 64, h: 76, speed: 39,
      peckDmg: 22, peckRate: 0.8,
      body: 0xe04a5c, light: 0xff7d8c, line: 0xb02b3c, comb: 0x8e1f34, tail: 0x8e1f34
    },
    giant: {
      name: '巨型公鸡', hp: 900, w: 105, h: 123, speed: 12,
      peckDmg: 30, peckRate: 1.0,
      body: 0xb04a8c, light: 0xd07bb0, line: 0x7e2f62, comb: 0x6b1f4e, tail: 0x6b1f4e,
      shockEvery: 3, shockDmg: 12
    }
  };
  const ENEMY = ENEMY_TYPES.normal;

  /* ---------------- 调试日志 ---------------- */
  const LOGS = [];
  const logBox = document.getElementById('dbg-log');

  function stamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function pushLog(msg) {
    const text = '[' + stamp() + '] ' + msg;
    LOGS.push(text);
    if (LOGS.length > 60) LOGS.shift();
    if (!logBox) return;
    const line = document.createElement('div');
    line.className = 'dbg-line';
    line.textContent = text;
    logBox.appendChild(line);
    while (logBox.childElementCount > 60) logBox.removeChild(logBox.firstChild);
    logBox.scrollTop = logBox.scrollHeight;
  }

  /* ---------------- 通用小工具 ---------------- */
  function makeRng(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function () {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  function lerpColor(a, b, t) {
    const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    return (Math.round(ar + (br - ar) * t) << 16) |
           (Math.round(ag + (bg - ag) * t) << 8) |
           Math.round(ab + (bb - ab) * t);
  }

  function hpColor(ratio) {
    const HEALTHY = 0x7fd8a8;
    const WARN = 0xffcf5c;
    const DANGER = 0xff9a72;
    if (ratio > 0.5) return lerpColor(WARN, HEALTHY, (ratio - 0.5) * 2);
    return lerpColor(DANGER, WARN, ratio * 2);
  }

  /* ---------------- 单位色块绘制（原点居中） ---------------- */
  function drawHen(g, s) {
    const half = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, half - 2, s * 0.84, s * 0.24);

    g.fillStyle(0xffd873, 1);
    g.fillRoundedRect(-half, -half + 4, s, s - 8, 20);

    g.fillStyle(0xffe28a, 0.85);
    g.fillRoundedRect(-half + 7, -half + 9, s - 14, (s - 8) * 0.44, 15);

    g.fillStyle(0xffb74d, 0.95);
    g.fillRoundedRect(-6, 8, s * 0.5, s * 0.28, 12);

    g.lineStyle(2, 0xe0a12f, 0.9);
    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 20);

    g.fillStyle(0xe8633f, 1);
    g.fillRoundedRect(-15, -half - 12, 30, 18, 9);

    g.fillStyle(0xff8c42, 1);
    g.fillTriangle(half - 4, 2, half + 16, 9, half - 4, 16);

    g.fillStyle(0x4a2c18, 1);
    g.fillCircle(-16, -10, 5);
    g.fillStyle(0xffffff, 0.9);
    g.fillCircle(-17.6, -11.6, 1.8);
  }

  function drawSniper(g, s) {
    const r = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, r - 2, s * 0.8, s * 0.24);

    g.fillStyle(0xffd8a8, 1);
    g.fillCircle(0, 0, r);
    g.fillStyle(0xffe8cc, 0.9);
    g.fillCircle(-r * 0.26, -r * 0.3, r * 0.56);
    g.lineStyle(2, 0xe8a86a, 0.95);
    g.strokeCircle(0, 0, r);

    g.fillStyle(0x9c7a63, 0.95);
    g.fillRoundedRect(r - 6, -6, 26, 12, 6);
    g.fillStyle(0xfff1de, 0.9);
    g.fillRoundedRect(r + 12, -4, 8, 8, 4);

    g.fillStyle(0xff9f43, 1);
    g.fillRoundedRect(-22, -r - 7, 44, 14, 7);
    g.fillStyle(0xffb86b, 0.9);
    g.fillRoundedRect(-22, -r - 7, 44, 6, 3);

    g.fillStyle(0x4a2c18, 1);
    g.fillCircle(-11, -4, 5);
    g.fillStyle(0xffffff, 0.9);
    g.fillCircle(-12.6, -5.6, 1.8);
  }

  function drawRock(g, s) {
    const half = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, half - 1, s * 0.85, s * 0.24);

    g.fillStyle(0xe8edf2, 1);
    g.fillRoundedRect(-half, -half, s, s, 16);
    g.fillStyle(0xf7fafc, 0.95);
    g.fillRoundedRect(-half + 8, -half + 8, s - 16, (s - 16) * 0.4, 12);
    g.lineStyle(2, 0xc3ccd4, 1);
    g.strokeRoundedRect(-half, -half, s, s, 16);

    g.lineStyle(2, 0xb8c4cd, 0.8);
    g.lineBetween(-6, -12, 12, 2);
    g.lineBetween(12, 2, 2, 22);

    g.fillStyle(0xd9e2e8, 1);
    g.fillCircle(-18, 18, 6);
  }

  function drawRooster(g, w, h, t) {
    const hw = w / 2;
    const hh = h / 2;
    const P0 = t || ENEMY_TYPES.normal;
    const combW = Math.max(26, w * 0.42);

    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, hh - 4, w * 0.9, h * 0.22);

    g.fillStyle(P0.tail, 1);
    g.fillTriangle(hw - 6, -10, hw + Math.round(w * 0.26), -26, hw + Math.round(w * 0.22), 4);

    g.fillStyle(P0.body, 1);
    g.fillRoundedRect(-hw, -hh + 6, w, h - 6, 16);

    g.fillStyle(P0.light, 0.9);
    g.fillRoundedRect(-hw + 8, -hh + 12, w - 16, (h - 6) * 0.44, 12);

    g.lineStyle(2, P0.line, 0.9);
    g.strokeRoundedRect(-hw, -hh + 6, w, h - 6, 16);

    g.fillStyle(P0.comb, 1);
    g.fillRoundedRect(-combW / 2, -hh - 6, combW, 16, 8);

    g.fillStyle(0xffc107, 1);
    g.fillTriangle(-hw + 4, -4, -hw - 16, 3, -hw + 4, 10);

    g.fillStyle(0xe53935, 1);
    g.fillCircle(-hw + 10, 16, 6);

    g.fillStyle(0xfff6e0, 1);
    g.fillCircle(-hw + 18, -16, 6);
    g.fillStyle(0x3e2723, 1);
    g.fillCircle(-hw + 18, -16, 2.8);
  }

  let activeScene = null;

  function drawCharger(g, s) {
    const half = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, half - 2, s * 0.84, s * 0.24);

    g.fillStyle(0x7fc4f0, 1);
    g.fillRoundedRect(-half, -half + 4, s, s - 8, 20);
    g.fillStyle(0xd6efff, 0.9);
    g.fillRoundedRect(-half + 8, -half + 10, s - 16, (s - 8) * 0.4, 14);
    g.lineStyle(2, 0x4f9bd0, 0.95);
    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 20);

    // 向右的冲刺箭头
    g.fillStyle(0xffffff, 0.95);
    g.fillTriangle(-6, -12, 18, 0, -6, 12);
    g.fillTriangle(10, -8, 26, 0, 10, 8);

    g.fillStyle(0x2e5c78, 1);
    g.fillCircle(-20, -8, 5);
    g.fillStyle(0xffffff, 0.9);
    g.fillCircle(-21.6, -9.6, 1.8);
  }

  function drawHealer(g, s) {
    const half = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, half - 2, s * 0.84, s * 0.24);

    g.fillStyle(0xffb3d1, 1);
    g.fillRoundedRect(-half, -half + 4, s, s - 8, 20);
    g.fillStyle(0xffd6e6, 0.9);
    g.fillRoundedRect(-half + 8, -half + 10, s - 16, (s - 8) * 0.4, 14);
    g.lineStyle(2, 0xe88bb0, 0.95);
    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 20);

    // 白色十字
    g.fillStyle(0xffffff, 0.95);
    g.fillRoundedRect(-7, -18, 14, 36, 6);

    g.fillStyle(0x8c3f5c, 1);

  function drawBomber(g, s) {
    const half = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, half - 2, s * 0.84, s * 0.24);

    g.fillStyle(0x4a4a5a, 1);
    g.fillRoundedRect(-half, -half + 4, s, s - 8, 20);
    g.fillStyle(0x63637a, 0.85);
    g.fillRoundedRect(-half + 8, -half + 10, s - 16, (s - 8) * 0.4, 14);
    g.lineStyle(2, 0x2e2e3a, 0.95);
    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 20);

    // 引线红点
    g.fillStyle(0xff5540, 1);
    g.fillCircle(16, -half - 2, 9);

  function drawGunner(g, s) {

    g.fillStyle(0x5c4326, 0.12);

    g.fillRoundedRect(-half, -half + 4, s, s - 8, 20);

    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 20);

    // 三连发弹丸
    g.fillStyle(0xffffff, 0.95);
    g.fillCircle(half - 14, -8, 5);
    g.fillCircle(half + 2, -8, 5);
    g.fillCircle(half + 18, -8, 5);

    g.fillStyle(0x2f6b52, 1);
    g.fillCircle(-16, 10, 5);
    g.fillStyle(0xffffff, 0.9);
    g.fillCircle(-17.6, 8.4, 1.8);

  function drawReflector(g, s) {
    const half = s / 2;
    g.fillStyle(0x5c4326, 0.12);
    g.fillEllipse(0, half - 2, s * 0.86, s * 0.24);

    g.fillStyle(0xb9a7d9, 1);
    g.fillRoundedRect(-half, -half + 4, s, s - 8, 18);
    g.fillStyle(0xd8cdef, 0.9);
    g.fillRoundedRect(-half + 8, -half + 10, s - 16, (s - 8) * 0.38, 12);
    g.lineStyle(3, 0x7f6aa8, 0.95);
    g.strokeRoundedRect(-half, -half + 4, s, s - 8, 18);

    // 护盾弧
    g.lineStyle(5, 0xffffff, 0.55);
    g.beginPath();
    g.arc(0, 2, half - 14, Phaser.Math.DegToRad(-60), Phaser.Math.DegToRad(60), false);
    g.strokePath();

    g.fillStyle(0x4a3a63, 1);
    g.fillCircle(-18, -12, 5.5);
    g.fillStyle(0xffffff, 0.9);
    g.fillCircle(-19.6, -13.6, 1.8);

  class GameScene extends Phaser.Scene {
    constructor() {
      super('GameScene');
    }

    create() {
      activeScene = this;

      this.corn = 50;
      this.over = false;
      this.paused = false;
      this.selected = null;
      this.clock = 0;

      this.units = [];
      this.enemies = [];
      this.bullets = [];
      this.drops = [];
      this.cards = [];

      this.baseHp = BASE.hp;
      this.state = 'PREPARING';
      this.waveIndex = 0;
      this.prepLeft = WAVES[0].prep;
      this.waveQueue = [];
      this.spawnTimer = 0;
      this.timers = { corn: 2.2 };
      this.pendingRow = null;

      this.drawArena();
      this.buildCards();
      this.buildHud();
      this.bindInput();
      this.refreshHud();
      this.startPrep();

      const pauseBtn = document.getElementById('dbg-pause');
      if (pauseBtn) pauseBtn.textContent = '⏸ 暂停';

      pushLog('🎮 新一局开始');
      if (!this.game.registry.get('storySeen')) {
        this.game.registry.set('storySeen', true);
        this.showStory();
      }
    }

    /* ---------------- 场地 ---------------- */
    drawArena() {
      const bg = this.add.graphics();
      bg.fillGradientStyle(0xfff8ec, 0xfff8ec, 0xffeed2, 0xffeed2, 1);
      bg.fillRect(0, 0, CANVAS_W, CANVAS_H);

      const panel = this.add.graphics();
      panel.fillStyle(0x8fd6b4, 0.42);
      panel.fillRoundedRect(G.x0 - 10, G.y0 - 10, GRID_W + 20, GRID_H + 20, 22);
      panel.fillStyle(0x5c4326, 0.06);
      panel.fillRoundedRect(G.x0 - 4, G.y0 - 4, GRID_W + 8, GRID_H + 8, 18);

      // 圆角格子
      const cells = this.add.graphics();
      for (let r = 0; r < G.rows; r++) {
        for (let c = 0; c < G.cols; c++) {
          const color = (r + c) % 2 === 0 ? 0x9adfc0 : 0x8ad6b4;
          cells.fillStyle(color, 1);
          cells.fillRoundedRect(
            cellX(c) - (G.cell - 8) / 2,
            cellY(r) - (G.cell - 8) / 2,
            G.cell - 8,
            G.cell - 8,
            12
          );
        }
      }

      // 草地纹理
      const tex = this.add.graphics();
      const rnd = makeRng(20261116);
      for (let i = 0; i < 760; i++) {
        const x = G.x0 + rnd() * GRID_W;
        const y = G.y0 + rnd() * GRID_H;
        const light = rnd() > 0.42;
        const len = 4 + rnd() * 7;
        tex.lineStyle(2, light ? 0xffffff : 0x4fae86, light ? 0.20 : 0.10);
        tex.lineBetween(x, y, x + (rnd() - 0.5) * 5, y - len);
      }

      // 极淡网格线
      const lines = this.add.graphics();
      lines.lineStyle(1, 0xffffff, 0.10);
      for (let c = 0; c <= G.cols; c++) {
        lines.lineBetween(G.x0 + c * G.cell, G.y0, G.x0 + c * G.cell, G.y0 + GRID_H);
      }
      for (let r = 0; r <= G.rows; r++) {
        lines.lineBetween(G.x0, G.y0 + r * G.cell, G.x0 + GRID_W, G.y0 + r * G.cell);
      }

      // 首页同款鸡蛋装饰（纯装饰，不参与任何玩法逻辑）
      const deco = this.add.graphics();
      deco.fillStyle(0xfffdf6, 0.55);
      deco.fillEllipse(G.x0 + 38, G.y0 + 34, 24, 32);
      deco.fillEllipse(G.x0 + GRID_W - 44, G.y0 + 38, 20, 26);
      deco.fillEllipse(G.x0 + 34, G.y0 + GRID_H - 34, 18, 24);
      deco.fillStyle(0xfff3c4, 0.45);
      deco.fillCircle(G.x0 + 30, G.y0 + 28, 6);
      deco.fillCircle(G.x0 + GRID_W - 52, G.y0 + 32, 5);

      const cy = G.y0 + GRID_H / 2;

      // 左侧暖黄鸡窝
      const nest = this.add.graphics();
      nest.fillStyle(0x5c4326, 0.10);
      nest.fillRoundedRect(6, G.y0 + 14, 92, GRID_H - 16, 18);

      nest.fillStyle(0xffc94d, 1);
      nest.fillRoundedRect(2, G.y0 + 8, 94, GRID_H - 16, 18);
      nest.fillStyle(0xffd97a, 0.85);
      nest.fillRoundedRect(8, G.y0 + 16, 82, 120, 14);
      nest.lineStyle(2, 0xe0a12f, 0.9);
      nest.strokeRoundedRect(2, G.y0 + 8, 94, GRID_H - 16, 18);

      nest.lineStyle(3, 0xd9a03a, 0.45);
      for (let i = 0; i < 5; i++) {
        const y = G.y0 + 70 + i * 92;
        nest.beginPath();
        nest.moveTo(12, y);
        nest.lineTo(86, y + 14);
        nest.strokePath();
        nest.beginPath();
        nest.moveTo(86, y + 40);
        nest.lineTo(12, y + 54);
        nest.strokePath();
      }

      nest.fillStyle(0xfff8e8, 1);
      nest.fillCircle(49, cy + 84, 15);
      nest.lineStyle(2, 0xe8cfa0, 1);
      nest.strokeCircle(49, cy + 84, 15);

      this.add.text(49, cy - 48, '鸡窝', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);
      this.add.text(49, cy - 20, '基地', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);

      // 基地血量
      this.baseBarBg = this.add.rectangle(49, cy + 36, 68, 10, 0x5c4326, 0.20);
      this.baseBarFg = this.add.rectangle(49 - 32, cy + 36, 64, 6, 0x7fd8a8).setOrigin(0, 0.5);
      this.baseHpText = this.add.text(49, cy + 58, String(BASE.hp), {
        fontFamily: FONT, fontSize: '18px', color: '#5a3b12', fontStyle: 'bold'
      }).setOrigin(0.5);

      // 右侧橘红出兵口
      const gate = this.add.graphics();
      gate.fillStyle(0x5c4326, 0.10);
      gate.fillRoundedRect(1186, G.y0 + 14, 92, GRID_H - 16, 18);

      gate.fillStyle(0xffb08a, 1);
      gate.fillRoundedRect(1184, G.y0 + 8, 94, GRID_H - 16, 18);
      gate.fillStyle(0xffd6c0, 0.8);
      gate.fillRoundedRect(1190, G.y0 + 16, 82, 120, 14);
      gate.lineStyle(2, 0xe8996f, 0.95);
      gate.strokeRoundedRect(1184, G.y0 + 8, 94, GRID_H - 16, 18);

      gate.fillStyle(0xfff0e4, 0.85);
      for (let i = 0; i < 4; i++) {
        gate.fillRoundedRect(1208, G.y0 + 96 + i * 122, 46, 12, 6);
      }

      this.add.text(1231, cy - 48, '公鸡', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);
      this.add.text(1231, cy - 20, '来袭', {
        fontFamily: FONT, fontSize: '21px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5);
    }

    /* ---------------- 卡牌 ---------------- */
    buildCards() {
      const defs = [
        { key: 'hen', label: '母鸡', cost: UNIT_DEFS.hen.cost, color: UNIT_DEFS.hen.color },
        { key: 'sniper', label: '小鸡狙击手', cost: UNIT_DEFS.sniper.cost, color: UNIT_DEFS.sniper.color },
        { key: 'rock', label: '石头蛋', cost: UNIT_DEFS.rock.cost, color: UNIT_DEFS.rock.color },
        { key: 'charger', label: '冲锋小鸡', cost: UNIT_DEFS.charger.cost, color: UNIT_DEFS.charger.color },
        { key: 'healer', label: '治愈母鸡', cost: UNIT_DEFS.healer.cost, color: UNIT_DEFS.healer.color },
        { key: 'bomber', label: '炸弹小鸡', cost: UNIT_DEFS.bomber.cost, color: UNIT_DEFS.bomber.color },
        { key: 'gunner', label: '高速连发鸡', cost: UNIT_DEFS.gunner.cost, color: UNIT_DEFS.gunner.color },
        { key: 'reflector', label: '重甲反伤母鸡', cost: UNIT_DEFS.reflector.cost, color: UNIT_DEFS.reflector.color }
      ];

      const bar = document.getElementById('card-bar');
      if (!bar) return;
      bar.innerHTML = '';

      defs.forEach((d) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card';
        btn.dataset.key = d.key;

        const ico = document.createElement('span');
        ico.className = 'card-ico';
        ico.style.background = '#' + d.color.toString(16).padStart(6, '0');

        const txt = document.createElement('span');
        txt.className = 'card-txt';
        const nm = document.createElement('b');
        nm.textContent = d.label;
        const cost = document.createElement('i');
        cost.textContent = d.cost + ' 玉米粒';
        txt.appendChild(nm);
        txt.appendChild(cost);

        btn.appendChild(ico);
        btn.appendChild(txt);
        btn.addEventListener('click', () => this.selectCard(d.key));
        bar.appendChild(btn);
      });

      this.syncCards();
    }

    selectCard(key) {
      if (this.over || this.paused) return;
      this.selected = this.selected === key ? null : key;
      this.syncCards();
    }

    syncCards() {
      const bar = document.getElementById('card-bar');
      if (!bar) return;
      bar.querySelectorAll('.card').forEach((btn) => {
        const def = UNIT_DEFS[btn.dataset.key];
        if (!def) return;
        btn.classList.toggle('sel', this.selected === btn.dataset.key);
        btn.classList.toggle('off', this.corn < def.cost);
      });
    }

    /* ---------------- HUD ---------------- */
    buildHud() {
      const pillW = 800;
      const pillH = 28;
      const pill = this.add.graphics();
      pill.fillStyle(0xfffdf8, 0.94);
      pill.fillRoundedRect(640 - pillW / 2, 634, pillW, pillH, 14);
      pill.lineStyle(2, 0xffcf5c, 0.95);
      pill.strokeRoundedRect(640 - pillW / 2, 634, pillW, pillH, 14);

      this.add.text(640, 648, '① 点卡牌选中   ② 点草坪格子放置   ③ 点掉落的玉米粒 +25', {
        fontFamily: FONT, fontSize: '15px', color: '#7b6650'
      }).setOrigin(0.5);

      this.pauseText = this.add.text(CANVAS_W / 2, CANVAS_H / 2, '⏸  已暂停', {
        fontFamily: FONT, fontSize: '46px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(70).setVisible(false).setShadow(0, 3, '#ffffff', 12);
    }

    setPrepLine(text) {
      const el = document.getElementById('prep-line');
      if (!el) return;
      if (!text) { el.hidden = true; return; }
      if (el.textContent !== text) el.textContent = text;
      el.hidden = false;
    }

    refreshHud() {
      const el = document.getElementById('corn-val');
      if (el) el.textContent = String(this.corn);
      this.syncCards();
    }

    bindInput() {
      this.hoverCell = this.add.rectangle(0, 0, G.cell - 10, G.cell - 10, 0xffffff, 0.10)
        .setVisible(false).setDepth(5);

      const zone = this.add.zone(G.x0, G.y0, GRID_W, GRID_H).setOrigin(0);
      zone.setInteractive(new Phaser.Geom.Rectangle(0, 0, GRID_W, GRID_H), Phaser.Geom.Rectangle.Contains);
      zone.on('pointerdown', (pointer) => this.onGridClick(pointer));
      zone.on('pointermove', (pointer) => this.onPointerMove(pointer));
      zone.on('pointerout', () => this.hoverCell.setVisible(false));
    }

    onPointerMove(pointer) {
      if (!this.selected || this.over) {
        this.hoverCell.setVisible(false);
        return;
      }
      const col = Math.floor((pointer.x - G.x0) / G.cell);
      const row = Math.floor((pointer.y - G.y0) / G.cell);
      if (col < 0 || col >= G.cols || row < 0 || row >= G.rows) {
        this.hoverCell.setVisible(false);
        return;
      }
      const busy = !!this.findUnit(row, col);
      this.hoverCell.setFillStyle(busy ? 0xffa27a : 0xbdf3d8, 0.32);
      this.hoverCell.setPosition(cellX(col), cellY(row));
      this.hoverCell.setVisible(true);
    }

    onGridClick(pointer) {
      if (this.over || this.paused || !this.selected) return;

      const col = Math.floor((pointer.x - G.x0) / G.cell);
      const row = Math.floor((pointer.y - G.y0) / G.cell);
      if (col < 0 || col >= G.cols || row < 0 || row >= G.rows) return;

      if (this.findUnit(row, col)) {
        this.flash(pointer.x, pointer.y, '这里已经有蛋了', '#d9673f');
        return;
      }

      const def = UNIT_DEFS[this.selected];
      if (this.corn < def.cost) {
        this.flash(pointer.x, pointer.y, '玉米粒不够', '#d9673f');
        return;
      }

      this.corn -= def.cost;
      this.spawnUnit(this.selected, row, col);
      this.selected = null;
      this.hoverCell.setVisible(false);
      this.refreshHud();
    }

    findUnit(row, col) {
      return this.units.find((u) => u.row === row && u.col === col);
    }

    flash(x, y, msg, color) {
      const t = this.add.text(x, y, msg, { fontFamily: FONT, fontSize: '22px', color })
        .setOrigin(0.5).setDepth(50);
      this.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 800, onComplete: () => t.destroy() });
    }

    /* ---------------- 特效 ---------------- */
    sparkle(x, y) {
      const ring = this.add.circle(x, y, 12, 0xffe9a8, 0.85).setStrokeStyle(3, 0xffd54a).setDepth(40);
      ring.setScale(0.35);
      this.tweens.add({
        targets: ring, scale: 1.7, alpha: 0, duration: 330, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });

      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 * i) / 6;
        const dot = this.add.circle(x, y, 3.5, 0xfff2b0).setDepth(40);
        this.tweens.add({
          targets: dot,
          x: x + Math.cos(a) * 34,
          y: y + Math.sin(a) * 34,
          alpha: 0,
          duration: 350,
          ease: 'Cubic.easeOut',
          onComplete: () => dot.destroy()
        });
      }
    }

    shatter(x, y, color, count, depth) {
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const dist = 26 + Math.random() * 34;
        const w = 7 + Math.random() * 8;
        const h = 6 + Math.random() * 8;
        const shard = this.add.rectangle(x, y, w, h, color, 0.95)
          .setDepth(depth || 30)
          .setStrokeStyle(1, 0x000000, 0.12);
        this.tweens.add({
          targets: shard,
          x: x + Math.cos(ang) * dist,
          y: y + Math.sin(ang) * dist + 16,
          angle: Phaser.Math.Between(-180, 180),
          alpha: 0,
          duration: 380 + Math.random() * 160,
          ease: 'Cubic.easeOut',
          onComplete: () => shard.destroy()
        });
      }
    }

    hitFlash(x, y, w, h) {
      const f = this.add.rectangle(x, y, w, h, 0xfff3c4, 0.55).setDepth(25);
      this.tweens.add({ targets: f, alpha: 0, duration: 130, onComplete: () => f.destroy() });
    }

    /* ---------------- 玩家单位 ---------------- */
    spawnUnit(key, row, col) {
      const def = UNIT_DEFS[key];
      const x = cellX(col);
      const y = cellY(row);

      const g = this.add.graphics();
      if (key === 'hen') drawHen(g, def.size);
      else if (key === 'sniper') drawSniper(g, def.size);
      else if (key === 'rock') drawRock(g, def.size);
      else if (key === 'charger') drawCharger(g, def.size);
      else if (key === 'healer') drawHealer(g, def.size);
      else if (key === 'bomber') drawBomber(g, def.size);
      else if (key === 'gunner') drawGunner(g, def.size);
      else drawReflector(g, def.size);
      g.setPosition(x, y);

      g.setScale(0.6);
      this.tweens.add({ targets: g, scale: 1, duration: 240, ease: 'Back.easeOut' });

      const barY = y - def.size / 2 - 20;
      const bar = this.makeBar(x, barY, def.size);

      const unit = {
        key, row, col, x, y,
        hp: def.hp,
        maxHp: def.hp,
        body: g,
        barY,
        bar,
        phase: Math.random() * Math.PI * 2,
        cd: key === 'hen' ? 2.5 : (key === 'healer' ? 3 : 0.4),
        removed: false,
        dashSpeed: 520,
        dashEnd: x + G.cell
      };
      this.units.push(unit);
      this.syncBar(bar, 0, x, barY);

      pushLog('🥚 放置 ' + def.name + ' → 第' + (row + 1) + '行 / 第' + (col + 1) + '列');
    }

    /* ---------------- 新单位：治愈 / 炸弹 / 冲锋 ---------------- */
    removeUnit(u) {
      if (!u || u.removed) return;
      u.removed = true;
      this.units = this.units.filter((x) => x !== u);
      if (u.body) u.body.destroy();
      if (u.bar && u.bar.bg) {
        u.bar.bg.destroy();
        u.bar.fg.destroy();
        u.bar.bg = null;
      }
    }

    healAround(u, amount) {
      let healed = 0;
      for (const o of this.units) {
        if (o === u || o.removed) continue;
        if (Math.abs(o.row - u.row) > 1 || Math.abs(o.col - u.col) > 1) continue;
        if (o.hp >= o.maxHp) continue;
        o.hp = Math.min(o.maxHp, o.hp + amount);
        this.setBarTarget(o.bar, o.hp, o.maxHp);
        healed += 1;
        this.flash(o.x, o.y - 26, '+' + amount, '#5fae7a');
      }

      const ring = this.add.circle(u.x, u.y, 38, 0xffffff, 0.10)
        .setStrokeStyle(3, 0x7fd8a8, 0.9).setDepth(12);
      this.tweens.add({
        targets: ring, scale: 2.0, alpha: 0, duration: 460, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });

      if (healed) pushLog('💗 治愈母鸡回复 ' + healed + ' 个单位 +' + amount);
    }

    detonate(u) {
      if (!u || u.removed) return;
      const dmg = 140;
      const cx = u.x;

      const victims = this.enemies.filter((e) =>
        Math.abs(e.row - u.row) <= 1 && Math.abs(e.x - cx) <= 180
      );
      victims.forEach((e) => this.damageEnemy(e, dmg));

      const ring = this.add.circle(cx, u.y, 26, 0xfff1c9, 0.30)
        .setStrokeStyle(4, 0xffb066, 0.9).setDepth(35);
      this.tweens.add({
        targets: ring, scale: 7, alpha: 0, duration: 440, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });

      const core = this.add.circle(cx, u.y, 16, 0xffffff, 0.55).setDepth(36);
      this.tweens.add({
        targets: core, scale: 2.6, alpha: 0, duration: 260,
        onComplete: () => core.destroy()
      });

      this.shatter(cx, u.y, 0x4a4a5a, 7, 30);
      pushLog('💣 炸弹小鸡引爆 · 命中 ' + victims.length + ' 只公鸡');
      this.removeUnit(u);
    }

    chargeBurst(u) {
      const ring = this.add.circle(u.x, u.y, 16, 0xdfefff, 0.45)
        .setStrokeStyle(3, 0x7fc4f0, 0.9).setDepth(30);
      this.tweens.add({
        targets: ring, scale: 2.4, alpha: 0, duration: 260,
        onComplete: () => ring.destroy()
      });
      this.shatter(u.x, u.y, 0x7fc4f0, 5, 30);
    }

    /* ---------------- 血条 ---------------- */
    makeBar(x, y, w) {
      const bg = this.add.rectangle(x, y, w + 6, 9, 0x5c4326, 0.16);
      const fg = this.add.rectangle(x - w / 2, y, w, 5, 0x7fd8a8).setOrigin(0, 0.5);
      return { bg, fg, w, target: 1, shown: 1 };
    }

    setBarTarget(bar, hp, maxHp) {
      bar.target = Phaser.Math.Clamp(hp / maxHp, 0, 1);
    }

    syncBar(bar, dt, x, y) {
      if (!bar || !bar.bg || !bar.bg.active) return;
      if (dt > 0) {
        bar.shown += (bar.target - bar.shown) * Math.min(1, dt * 12);
        if (Math.abs(bar.target - bar.shown) < 0.002) bar.shown = bar.target;
      }
      bar.bg.setPosition(x, y);
      bar.fg.displayWidth = Math.max(0.01, bar.w * bar.shown);
      bar.fg.setPosition(x - bar.w / 2, y);
      bar.fg.fillColor = hpColor(bar.shown);
    }

    /* ---------------- 敌人 ---------------- */
    spawnEnemy(rowArg, typeArg) {
      const typeKey = typeArg || 'normal';
      const t = ENEMY_TYPES[typeKey] || ENEMY_TYPES.normal;

      const row = (typeof rowArg === 'number' && rowArg >= 0 && rowArg < G.rows)
        ? rowArg
        : Phaser.Math.Between(0, G.rows - 1);
      const y = cellY(row);
      const x = 1250;

      const body = this.add.graphics();
      drawRooster(body, t.w, t.h, t);
      body.setPosition(x, y);

      const barY = y - t.h / 2 - 26;
      const bar = this.makeBar(x, barY, Math.max(56, t.w - 8));

      const e = {
        type: typeKey,
        row, x, y,
        hp: t.hp,
        maxHp: t.hp,
        attackCd: 0,
        speed: t.speed,
        w: t.w,
        h: t.h,
        peckDmg: t.peckDmg,
        peckRate: t.peckRate,
        shockEvery: t.shockEvery || 0,
        shockDmg: t.shockDmg || 0,
        peckCount: 0,
        body,
        barY,
        bar,
        walkPhase: 0
      };
      this.enemies.push(e);
      this.syncEnemy(e);
      this.syncBar(bar, 0, x, barY);

      pushLog('🦃 第' + (this.waveIndex + 1) + '波 · 第' + (row + 1) + '行 ｜ ' + t.name +
        ' HP ' + t.hp);
    }

    syncEnemy(e) {
      e.body.setPosition(e.x, e.y);
    }

    findBlocker(e) {
      let best = null;
      for (const u of this.units) {
        if (u.row !== e.row) continue;
        const gap = e.x - u.x;
        const reach = 46 + (e.w || 70) / 2;
        if (gap <= reach && gap >= -50) {
          if (!best || u.x > best.x) best = u;
        }
      }
      return best;
    }

    damageEnemy(e, dmg) {
      e.hp -= dmg;

      if (e.hp <= 0) {
        this.enemies = this.enemies.filter((x) => x !== e);
        e.bar.bg.destroy();
        e.bar.fg.destroy();
        e.bar.bg = null;
        this.shatter(e.x, e.y, 0xff6a4d, 7, 30);
        this.tweens.add({
          targets: e.body, alpha: 0, scaleX: 1.2, scaleY: 1.2, duration: 200,
          onComplete: () => e.body.destroy()
        });
        pushLog('💥 公鸡倒下 第' + (e.row + 1) + '行');
      } else {
        this.setBarTarget(e.bar, e.hp, e.maxHp);
        this.hitFlash(e.x, e.y, (e.w || 70) * 0.9, (e.h || 82) * 0.9);
        this.tweens.add({ targets: e.body, scaleX: 1.08, scaleY: 0.94, duration: 70, yoyo: true });
        pushLog('🎯 命中 第' + (e.row + 1) + '行 ｜ -' + dmg + ' → 剩余 ' + Math.max(0, e.hp));
      }
    }

    damageUnit(u, dmg, attacker) {
      u.hp -= dmg;

      if (u.hp <= 0) {
        u.removed = true;
        this.units = this.units.filter((x) => x !== u);
        u.bar.bg.destroy();
        u.bar.fg.destroy();
        u.bar.bg = null;

        const color = (UNIT_DEFS[u.key] && UNIT_DEFS[u.key].color) || 0xffd8a8;
        this.shatter(u.x, u.y, color, u.key === 'rock' ? 9 : 6, 30);
        this.tweens.add({
          targets: u.body, alpha: 0, scaleX: 1.15, scaleY: 1.15, duration: 180,
          onComplete: () => u.body.destroy()
        });
        this.flash(u.x, u.y - 20, '碎了！', '#d9673f');
        pushLog('💔 ' + UNIT_DEFS[u.key].name + ' 被啄碎（第' + (u.row + 1) + '行）');
      } else {
        this.setBarTarget(u.bar, u.hp, u.maxHp);
        this.tweens.add({ targets: u.body, alpha: 0.5, duration: 60, yoyo: true });

        // 重甲反伤：被啃时反弹伤害给公鸡
        if (u.key === 'reflector' && attacker && attacker.hp > 0) {
          const reflect = 25;
          this.damageEnemy(attacker, reflect);
          this.flash(attacker.x, attacker.y - 34, '-' + reflect, '#8e3b8e');
          const ring = this.add.circle(u.x, u.y, 26, 0xe0d4ff, 0.30)
            .setStrokeStyle(3, 0x7f6aa8, 0.9).setDepth(22);
          this.tweens.add({
            targets: ring, scale: 1.8, alpha: 0, duration: 280,
            onComplete: () => ring.destroy()
          });
          pushLog('🛡 反伤 -' + reflect + ' → 公鸡剩余 ' + Math.max(0, attacker.hp));
        }
      }
    }

    giantShock(e) {
      const victims = this.units.filter((u) =>
        !u.removed && Math.abs(u.row - e.row) <= 1 && Math.abs(u.x - e.x) <= 180
      );
      victims.forEach((u) => this.damageUnit(u, e.shockDmg, null));

      const ring = this.add.circle(e.x, e.y, 40, 0xe0c8ff, 0.16)
        .setStrokeStyle(4, 0x8e5bb5, 0.75).setDepth(28);
      this.tweens.add({
        targets: ring, scale: 4.2, alpha: 0, duration: 520, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy()
      });
      pushLog('💥 ' + ENEMY_TYPES[e.type].name + ' 震慑 · 命中 ' + victims.length + ' 个单位');
    }

    /* ---------------- 子弹 ---------------- */
    fireBullet(u, dmg, speed, radius) {
      const damage = dmg || 26;
      const spd = speed || 430;
      const r = radius || 7.5;
      const x = u.x + 36;
      const glow = this.add.circle(x, u.y, r + 5, 0xffd08a, 0.26).setDepth(16);
      const core = this.add.circle(x, u.y, r, 0xfff6e0).setStrokeStyle(2, 0xffa94d).setDepth(17);
      this.bullets.push({ x, y: u.y, row: u.row, speed: spd, dmg: damage, core, glow, t: 0 });
    }

    nearestEnemyInRange(u, range) {
      let best = null;
      for (const e of this.enemies) {
        if (e.row !== u.row) continue;
        if (e.x <= u.x + 10) continue;
        if (e.x - u.x > range) continue;
        if (!best || e.x < best.x) best = e;
      }
      return best;
    }

    nearestEnemyAhead(u) {
      let best = null;
      for (const e of this.enemies) {
        if (e.row !== u.row) continue;
        if (e.x <= u.x + 10) continue;
        if (!best || e.x < best.x) best = e;
      }
      return best;
    }

    removeBullet(b) {
      b.core.destroy();
      b.glow.destroy();
      this.bullets = this.bullets.filter((x) => x !== b);
    }

    /* ---------------- 鸡窝基地血量 ---------------- */
    damageBase(dmg) {
      if (this.over || this.baseHp <= 0) return;
      this.baseHp = Math.max(0, this.baseHp - dmg);
      this.updateBaseHp();
      this.flash(78, G.y0 + GRID_H / 2 + 58, '-' + dmg, '#d9673f');
      pushLog('🏠 鸡窝被啄 -' + dmg + ' → 剩余 ' + this.baseHp);

      if (this.baseHp <= 0) this.gameOver();
    }

    updateBaseHp() {
      if (!this.baseBarFg) return;
      const ratio = Phaser.Math.Clamp(this.baseHp / BASE.hp, 0, 1);
      this.baseBarFg.displayWidth = Math.max(0.01, 64 * ratio);
      this.baseBarFg.fillColor = hpColor(ratio);
      if (this.baseHpText) this.baseHpText.setText(String(this.baseHp));
    }

    /* ---------------- 掉落玉米粒 ---------------- */
    dropCorn(x, y0, targetY, life, owner) {
      const glow = this.add.circle(x, y0, 27, 0xfff0b8, 0.20).setDepth(18);
      const main = this.add.circle(x, y0, 15, 0xffd54a).setStrokeStyle(3, 0xe0a800).setDepth(20);
      const hi = this.add.circle(x - 5, y0 - 5, 4, 0xfff2b0).setDepth(21);
      // 视觉半径 15 不变；点击热区放大到半径 40（直径 80px），更好点中
      main.setInteractive({
        hitArea: new Phaser.Geom.Circle(15, 15, 40),
        hitAreaCallback: Phaser.Geom.Circle.Contains,
        useHandCursor: true
      });

      const d = {
        x, y: y0, vy: 0, targetY, life, main, hi, glow,
        owner: owner || null, alive: true,
        phase: Math.random() * Math.PI * 2,
        landed: false,
        settling: false
      };

      main.on('pointerdown', (pointer, lx, ly, event) => {
        if (event && event.stopPropagation) event.stopPropagation();
        this.collectCorn(d);
      });

      this.drops.push(d);
    }

    removeDrop(d) {
      if (!d.alive) return;
      d.alive = false;
      d.main.destroy();
      d.hi.destroy();
      this.drops = this.drops.filter((x) => x !== d);
    }

    collectCorn(d) {
      // 点任意一颗 = 全场一起收
      if (!this.drops.length) return;
      const all = this.drops.slice();
      let total = 0;
      all.forEach((one) => {
        if (!one.alive) return;
        total += 1;
        this.collectOne(one);
      });
      if (total > 1) pushLog('🌽 一键全收 · ' + total + ' 颗');
    }

    collectOne(d) {
      if (!d.alive) return;
      this.corn += 25;
      this.refreshHud();
      this.sparkle(d.x, d.y);

      // 玉米粒飞向右上角数字
      const fly = this.add.circle(d.main.x, d.main.y, 12, 0xffd54a)
        .setStrokeStyle(2, 0xe0a800).setDepth(45);
      this.tweens.add({
        targets: fly,
        x: 1240, y: 26, scale: 0.4, alpha: 0.95,
        duration: 430, ease: 'Cubic.easeIn',
        onComplete: () => { fly.destroy(); this.pulseCorn(); }
      });

      // 轻快的缩小消失反馈
      d.alive = false;
      this.drops = this.drops.filter((x) => x !== d);
      this.tweens.add({
        targets: [d.main, d.hi, d.glow],
        scale: 0.15, alpha: 0,
        duration: 150, ease: 'Back.easeIn',
        onComplete: () => { d.main.destroy(); d.hi.destroy(); d.glow.destroy(); }
      });

      pushLog('🌽 拾取玉米粒 +25 → 当前 ' + this.corn);
    }

    pulseCorn() {
      const el = document.getElementById('corn-val');
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }

    dropSkyCorn() {
      const x = Phaser.Math.Between(G.x0 + 50, G.x0 + GRID_W - 50);
      const targetY = Phaser.Math.Between(G.y0 + 50, G.y0 + GRID_H - 50);
      this.dropCorn(x, -30, targetY, 9, null);
    }

    dropHenCorn(u) {
      const owned = this.drops.filter((d) => d.owner === u).length;
      if (owned >= 3) return;
      this.dropCorn(u.x, u.y - 46, u.y - 76, 8, u);
    }

    /* ---------------- 公鸡来袭预警 ---------------- */
    showSpawnWarning(row) {
      const y = cellY(row);

      // 红光闪烁（3 秒，跟着出兵倒计时一起呼吸）
      const halo = this.add.graphics().setDepth(9);
      halo.fillStyle(0xd89b5a, 0.28);
      halo.fillEllipse(0, 0, 96, 108);
      halo.lineStyle(4, 0xb97a3c, 0.7);
      halo.strokeEllipse(0, 0, 96, 108);
      halo.setPosition(1231, y);

      this.tweens.add({
        targets: halo,
        alpha: 0.25, scaleX: 1.14, scaleY: 1.14,
        duration: 300, yoyo: true, repeat: 4, ease: 'Sine.easeInOut',
        onComplete: () => {
          this.tweens.add({
            targets: halo, alpha: 0, duration: 180,
            onComplete: () => halo.destroy()
          });
        }
      });

      const tip = this.add.text(1231, y - 66, '公鸡来袭 3s', {
        fontFamily: FONT, fontSize: '19px', color: '#8a5a2b', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(10);

      this.tweens.add({
        targets: tip, alpha: 0.35,
        duration: 300, yoyo: true, repeat: 4,
        onComplete: () => {
          this.tweens.add({
            targets: tip, y: y - 84, alpha: 0, duration: 180,
            onComplete: () => tip.destroy()
          });
        }
      });

      pushLog('⚠ 预警：第' + (row + 1) + '行即将出鸡');
    }

    /* ---------------- 新手引导 ---------------- */
    showStory() {
      this.paused = true;

      const items = [];
      const dim = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x5c4326, 0.45).setDepth(90);

      const card = this.add.graphics().setDepth(91);
      card.fillStyle(0x5c4326, 0.18);
      card.fillRoundedRect(258, 158, 776, 328, 30);
      card.fillStyle(0xfffdf6, 0.98);
      card.fillRoundedRect(252, 150, 776, 328, 30);
      card.lineStyle(3, 0xffcf5c, 1);
      card.strokeRoundedRect(252, 150, 776, 328, 30);

      const title = this.add.text(640, 202, '🌽 玉米村告急', {
        fontFamily: FONT, fontSize: '34px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(92);

      const body = this.add.text(640, 292, '公鸡军团来袭了！\n玉米村陷入危机，母鸡们需要你的指挥！', {
        fontFamily: FONT, fontSize: '25px', color: '#7b6650',
        align: 'center', lineSpacing: 14, wordWrap: { width: 640 }
      }).setOrigin(0.5).setDepth(92);

      const btnG = this.add.graphics().setDepth(92);
      btnG.fillStyle(0xffcf5c, 1);
      btnG.fillRoundedRect(520, 392, 240, 60, 30);

      const btnT = this.add.text(640, 422, '开始保卫', {
        fontFamily: FONT, fontSize: '24px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(93);

      const hit = this.add.rectangle(640, 422, 240, 60, 0xffffff, 0.001)
        .setDepth(94).setInteractive({ useHandCursor: true });

      items.push(dim, card, title, body, btnG, btnT, hit);

      hit.on('pointerdown', (p, x, y, ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        if (this.storyClosed) return;
        this.storyClosed = true;
        this.paused = false;
        items.forEach((o) => { if (o && o.destroy) o.destroy(); });
        pushLog('📖 开场剧情已关闭');
        this.showToast('布置母鸡军团，保卫玉米！');
      });

      pushLog('📖 开场剧情弹出（游戏已暂停）');
    }

    showToast(text) {
      const t = this.add.text(640, 64, text, {
        fontFamily: FONT, fontSize: '22px', color: '#8a5a2b', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(60).setAlpha(0);

      this.tweens.add({ targets: t, alpha: 1, y: 80, duration: 380, ease: 'Cubic.easeOut' });
      this.time.delayedCall(2600, () => {
        this.tweens.add({
          targets: t, alpha: 0, y: 62, duration: 420, ease: 'Cubic.easeIn',
          onComplete: () => t.destroy()
        });
      });
    }

    /* ---------------- 波次系统 ---------------- */
    buildQueue(cfg) {
      const list = [];
      for (let i = 0; i < cfg.normal; i++) list.push('normal');
      for (let i = 0; i < cfg.raider; i++) list.push('raider');

      for (let i = list.length - 1; i > 0; i--) {
        const j = Phaser.Math.Between(0, i);
        const t = list[i]; list[i] = list[j]; list[j] = t;
      }

      for (let i = 0; i < cfg.giant; i++) list.push('giant');
      return list;
    }

    startPrep() {
      const cfg = WAVES[this.waveIndex];
      this.state = 'PREPARING';
      this.over = false;
      this.paused = false;
      this.prepLeft = cfg.prep;
      this.pendingRow = null;
      this.spawnTimer = 0;
      this.waveQueue = this.buildQueue(cfg);

      this.setPrepLine('第 ' + (this.waveIndex + 1) + ' 波 · 准备 ' + Math.ceil(this.prepLeft) + 's');
      pushLog('📦 第 ' + (this.waveIndex + 1) + ' 波准备 · 敌方 ' + this.waveQueue.length + ' 只');
    }

    startFighting() {
      this.state = 'FIGHTING';
      this.spawnTimer = 0.8;
      this.setPrepLine(null);
      pushLog('⚔ 第 ' + (this.waveIndex + 1) + ' 波开战！');
    }

    updateSpawner(dt) {
      if (!this.waveQueue.length) return;

      this.spawnTimer -= dt;
      if (this.pendingRow === null && this.spawnTimer <= 3) {
        this.pendingRow = Phaser.Math.Between(0, G.rows - 1);
        this.showSpawnWarning(this.pendingRow);
      }

      if (this.spawnTimer <= 0) {
        const type = this.waveQueue.shift();
        this.spawnEnemy(this.pendingRow, type);
        this.pendingRow = null;
        this.spawnTimer = WAVES[this.waveIndex].interval;
      }
    }

    checkWaveClear() {
      if (this.over || this.state !== 'FIGHTING') return;
      if (this.waveQueue.length > 0) return;
      if (this.enemies.length > 0) return;

      this.state = 'WIN';
      this.paused = true;               // 冻结主循环，防止结算时还在跑
      const last = this.waveIndex >= WAVES.length - 1;
      pushLog(last ? '🏆 第 5 波清空，全部通关' : '🎉 第 ' + (this.waveIndex + 1) + ' 波清空');

      this.showEndModal({
        title: last ? '🏆 玉米村保卫战大获全胜！' : '🎉 胜利！',
        body: last ? '公鸡军团彻底撤退，玉米村安全了！' : '公鸡军团暂时撤退了。',
        button: last ? '再玩一局' : '进入第 ' + (this.waveIndex + 2) + ' 波',
        onClose: last ? null : () => {
          this.waveIndex += 1;
          this.startPrep();             // 切回准备阶段 15 秒
        }
      });
    }

    showEndModal(opts) {
      this.over = true;
      this.paused = true;
      this.selected = null;
      this.syncCards();
      if (this.hoverCell) this.hoverCell.setVisible(false);
      this.setPrepLine(null);

      const items = [];
      const dim = this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x5c4326, 0.55).setDepth(100);

      const card = this.add.graphics().setDepth(101);
      card.fillStyle(0xfffdf6, 0.98);
      card.fillRoundedRect(320, 168, 640, 316, 28);
      card.lineStyle(3, 0xffcf5c, 1);
      card.strokeRoundedRect(320, 168, 640, 316, 28);

      const title = this.add.text(640, 232, opts.title, {
        fontFamily: FONT, fontSize: '33px', color: '#5c4326', fontStyle: 'bold',
        align: 'center', wordWrap: { width: 580 }
      }).setOrigin(0.5).setDepth(102);

      const body = this.add.text(640, 320, opts.body, {
        fontFamily: FONT, fontSize: '24px', color: '#7b6650', align: 'center',
        wordWrap: { width: 560 }, lineSpacing: 10
      }).setOrigin(0.5).setDepth(102);

      const btnG = this.add.graphics().setDepth(102);
      btnG.fillStyle(0xffcf5c, 1);
      btnG.fillRoundedRect(510, 390, 260, 60, 30);

      const btnT = this.add.text(640, 420, opts.button, {
        fontFamily: FONT, fontSize: '24px', color: '#5c4326', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(103);

      const hit = this.add.rectangle(640, 420, 260, 60, 0xffffff, 0.001)
        .setDepth(104).setInteractive({ useHandCursor: true });

      items.push(dim, card, title, body, btnG, btnT, hit);

      hit.on('pointerdown', (p, x, y, ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        items.forEach((o) => { if (o && o.destroy) o.destroy(); });
        if (opts.onClose) {
          this.over = false;
          this.paused = false;
          opts.onClose();
        } else {
          this.scene.restart();
        }
      });
    }

    /* ---------------- 帧更新 ---------------- */
    update(time, delta) {
      if (this.over || this.paused) return;
      const dt = Math.min(delta, 120) / 1000;
      this.clock += dt;

      // 状态机：准备 / 战斗
      if (this.state === 'PREPARING') {
        this.prepLeft -= dt;
        this.setPrepLine('第 ' + (this.waveIndex + 1) + ' 波 · 准备 ' +
          Math.ceil(Math.max(0, this.prepLeft)) + 's');
        if (this.prepLeft <= 0) this.startFighting();
      } else if (this.state === 'FIGHTING') {
        this.updateSpawner(dt);
      }

      // 天上掉玉米粒：频率小幅提高（2.6~4.2 秒一颗）
      this.timers.corn -= dt;
      if (this.timers.corn <= 0) {
        this.dropSkyCorn();
        this.timers.corn = 2.6 + Math.random() * 1.6;
      }

      this.updateUnits(dt);
      this.updateEnemies(dt);
      this.updateBullets(dt);
      this.updateDrops(dt);

      // 本波清空判定：存活 0 且待刷队列 0
      this.checkWaveClear();
    }

    updateUnits(dt) {
      for (const u of this.units.slice()) {
        if (u.removed) continue;
        this.syncBar(u.bar, dt, u.x, u.barY);

        // 待机轻微上下浮动，让画面有呼吸感
        u.body.y = u.y + Math.sin(this.clock * 2.2 + u.phase) * 1.6;

        if (u.key === 'sniper') {
          u.cd -= dt;
          if (u.cd <= 0) {
            if (this.nearestEnemyAhead(u)) {
              this.fireBullet(u);
              u.cd = 1.2;
            } else {
              u.cd = 0;
            }
          }
        } else if (u.key === 'hen') {
          u.cd -= dt;
          if (u.cd <= 0) {
            this.dropHenCorn(u);
            u.cd = 5;
          }
        } else if (u.key === 'gunner') {
          u.cd -= dt;
          if (u.cd <= 0) {
            const target = this.nearestEnemyInRange(u, G.cell * 3);
            if (target) {
              this.fireBullet(u, 10, 640, 6);
              u.cd = 0.6;
            } else {
              u.cd = 0;
            }
          }
        } else if (u.key === 'healer') {
          u.cd -= dt;
          if (u.cd <= 0) {
            u.cd = 3;
            this.healAround(u, 10);
          }
        } else if (u.key === 'bomber') {
          const near = this.enemies.find((e) =>
            e.row === u.row && Math.abs(e.x - u.x) <= 118
          );
          if (near) this.detonate(u);
        } else if (u.key === 'charger') {
          u.x += u.dashSpeed * dt;
          u.body.x = u.x;

          let hit = null;
          for (const e of this.enemies) {
            if (e.row !== u.row) continue;
            if (Math.abs(e.x - u.x) <= 42) { hit = e; break; }
          }

          if (hit) {
            this.damageEnemy(hit, 120);
            this.chargeBurst(u);
            this.removeUnit(u);
          } else if (u.x >= u.dashEnd) {
            this.chargeBurst(u);
            this.removeUnit(u);
          }
        }
      }
    }

    updateEnemies(dt) {
      for (const e of this.enemies.slice()) {
        this.syncBar(e.bar, dt, e.x, e.barY);

        const blocker = this.findBlocker(e);
        if (blocker) {
          e.body.angle = 0;
          e.attackCd -= dt;
          if (e.attackCd <= 0) {
            e.attackCd = e.peckRate;
            this.damageUnit(blocker, e.peckDmg, e);
            e.peckCount += 1;
            if (e.shockEvery && e.peckCount % e.shockEvery === 0) this.giantShock(e);
            if (this.over || !e.body.active) continue;
            this.tweens.add({
              targets: e.body, x: e.x - 9, duration: 85, yoyo: true,
              onComplete: () => { if (e.body.active) e.body.x = e.x; }
            });
          }
        } else if (e.x > G.x0 + 34) {
          e.x -= (e.speed || ENEMY.speed) * dt;
          this.syncEnemy(e);

          // 走路时左右轻摆
          e.walkPhase += dt * 9;
          e.body.angle = Math.sin(e.walkPhase) * 2.6;

          if (e.x <= G.x0 + 34) {
            e.x = G.x0 + 34;
            this.syncEnemy(e);
          }
        } else {
          // 走到鸡窝：开始啃基地
          e.body.angle = 0;
          e.attackCd -= dt;
          if (e.attackCd <= 0) {
            e.attackCd = BASE.peckRate;
            e.peckCount += 1;
            this.damageBase(e.peckDmg || BASE.peckDmg);
            this.tweens.add({
              targets: e.body, x: e.x + 7, duration: 80, yoyo: true,
              onComplete: () => { if (e.body.active) e.body.x = e.x; }
            });
            if (e.shockEvery && e.peckCount % e.shockEvery === 0) this.giantShock(e);
            if (this.over) return;
          }
        }
      }
    }

    updateBullets(dt) {
      for (const b of this.bullets.slice()) {
        b.x += b.speed * dt;
        b.t += dt;

        const pulse = 1 + 0.12 * Math.sin(b.t * 20);
        b.core.setPosition(b.x, b.y).setScale(pulse);
        b.glow.setPosition(b.x, b.y).setScale(1 + 0.16 * Math.sin(b.t * 20 + 1.1));

        let hit = null;
        for (const e of this.enemies) {
          if (e.row !== b.row) continue;
          if (Math.abs(e.x - b.x) <= 34) { hit = e; break; }
        }

        if (hit) {
          this.damageEnemy(hit, b.dmg);
          this.removeBullet(b);
        } else if (b.x > CANVAS_W + 20) {
          this.removeBullet(b);
        }
      }
    }

    updateDrops(dt) {
      for (const d of this.drops.slice()) {
        d.life -= dt;

        // 呼吸光晕：始终轻微起伏，帮助玩家一眼看到
        const breath = Math.sin(this.clock * 2.4 + d.phase);
        d.glow.setScale(1 + 0.14 * breath);
        d.glow.setAlpha(0.16 + 0.10 * (0.5 + 0.5 * breath));

        if (!d.landed) {
          d.vy = Math.min(320, d.vy + 900 * dt);
          d.y = Math.min(d.targetY, d.y + d.vy * dt);
          d.phase += dt * 6;
          const sway = Math.sin(d.phase) * 3;
          d.main.setPosition(d.x + sway, d.y);
          d.hi.setPosition(d.x + sway - 5, d.y - 5);
          d.glow.setPosition(d.x + sway, d.y);

          if (d.y >= d.targetY) {
            d.landed = true;
            d.settling = true;
            this.tweens.add({
              targets: d.main, scaleX: 1.15, scaleY: 0.86, duration: 90, yoyo: true,
              onComplete: () => { d.main.setScale(1); d.settling = false; }
            });
          }
        } else {
          if (!d.settling) {
            const b = 1 + Math.sin(d.life * 4) * 0.04;
            d.main.setScale(b);
          }
          d.glow.setPosition(d.x, d.y);
        }

        if (d.life <= 2) {
          const a = 0.3 + 0.7 * Math.abs(Math.sin(d.life * 6));
          d.main.setAlpha(a);
          d.hi.setAlpha(a);
        }
        if (d.life <= 0) {
          d.alive = false;
          this.drops = this.drops.filter((x) => x !== d);
          this.tweens.add({
            targets: [d.main, d.hi, d.glow], scale: 0.2, alpha: 0,
            duration: 160,
            onComplete: () => { d.main.destroy(); d.hi.destroy(); d.glow.destroy(); }
          });
        }
      }
    }

    /* ---------------- 调试后台接口 ---------------- */
    togglePause() {
      if (this.over) return false;
      this.paused = !this.paused;
      if (this.pauseText) this.pauseText.setVisible(this.paused);
      pushLog(this.paused ? '⏸ 游戏暂停' : '▶ 游戏继续');
      return this.paused;
    }

    debugSpawnEnemy() {
      if (this.over) return;
      this.spawnEnemy();
    }

    setCorn(value) {
      const n = Math.max(0, Math.floor(value));
      this.corn = n;
      this.refreshHud();
      pushLog('⚙ 玉米粒手动设为 ' + n);
    }

    clearUnits() {
      const n = this.units.length;
      this.units.forEach((u) => {
        u.body.destroy();
        u.bar.bg.destroy();
        u.bar.fg.destroy();
      });
      this.units = [];

      this.bullets.forEach((b) => {
        b.core.destroy();
        b.glow.destroy();
      });
      this.bullets = [];

      pushLog('🧹 清空场上单位（' + n + ' 个）');
    }

    /* ---------------- 结束 ---------------- */
    gameOver() {
      if (this.over) return;
      this.state = 'LOSE';
      pushLog('🚨 鸡窝被啃空，玉米村失守');
      this.showEndModal({
        title: '💧 玉米村失守了……',
        body: '再试一次吧！',
        button: '重新挑战',
        onClose: null
      });
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: CANVAS_W,
    height: CANVAS_H,
    parent: 'game',
    backgroundColor: '#fff8ec',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: [GameScene]
  };

  new Phaser.Game(config);

  /* ---------------- 调试面板 DOM 绑定 ---------------- */
  const panel = document.getElementById('dbg-panel');
  const pauseBtn = document.getElementById('dbg-pause');

  document.getElementById('dbg-toggle').addEventListener('click', () => {
    panel.classList.toggle('open');
  });
  document.getElementById('dbg-hide').addEventListener('click', () => {
    panel.classList.remove('open');
  });

  pauseBtn.addEventListener('click', () => {
    if (!activeScene) return;
    const paused = activeScene.togglePause();
    pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  });

  document.getElementById('dbg-spawn').addEventListener('click', () => {
    if (activeScene) activeScene.debugSpawnEnemy();
  });

  document.getElementById('dbg-clear').addEventListener('click', () => {
    if (activeScene) activeScene.clearUnits();
  });

  document.getElementById('dbg-corn-set').addEventListener('click', () => {
    const input = document.getElementById('dbg-corn');
    const v = parseInt(input.value, 10);
    if (!activeScene) return;
    if (!Number.isFinite(v) || v < 0) {
      pushLog('⚠ 玉米粒输入无效');
      return;
    }
    activeScene.setCorn(v);
  });
}
</script>
