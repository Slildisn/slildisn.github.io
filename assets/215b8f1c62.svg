<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="灭霸">
  <defs>
    <radialGradient id="tbg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#2a1240"/>
      <stop offset="62%" stop-color="#170a24"/>
      <stop offset="100%" stop-color="#0a0410"/>
    </radialGradient>
    <linearGradient id="gaunt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3c96b"/>
      <stop offset="55%" stop-color="#c99a3c"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
    <radialGradient id="tglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a45cff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#a45cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tclip"><circle cx="48" cy="48" r="46"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#tbg)"/>
  <circle cx="48" cy="46" r="30" fill="url(#tglow)"/>
  <g clip-path="url(#tclip)">
    <!-- 手套主体 -->
    <path d="M30 62 q0 -22 18 -22 q18 0 18 22 l0 12 q-18 8 -36 0z" fill="url(#gaunt)" opacity=".92"/>
    <!-- 指节 -->
    <g stroke="#7a5416" stroke-width="1.6" fill="none" opacity=".8">
      <path d="M34 48 h28"/><path d="M34 55 h28"/>
    </g>
    <!-- 六颗宝石 -->
    <circle cx="40" cy="42" r="3.4" fill="#ffd12e"/>
    <circle cx="48" cy="40" r="3.4" fill="#37a8ff"/>
    <circle cx="56" cy="42" r="3.4" fill="#ff4b4b"/>
    <circle cx="38" cy="55" r="3.2" fill="#a45cff"/>
    <circle cx="48" cy="58" r="3.2" fill="#3ddc84"/>
    <circle cx="58" cy="55" r="3.2" fill="#ff9a2e"/>
    <!-- 光晕 -->
    <circle cx="48" cy="48" r="22" fill="none" stroke="#c99a3c" stroke-opacity=".35" stroke-width="1.2"/>
  </g>
  <circle cx="48" cy="48" r="46" fill="none" stroke="#c99a3c" stroke-opacity=".55" stroke-width="1.5"/>
