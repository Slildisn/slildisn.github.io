    <!-- 面罩 -->
    <path d="M24 42 q24 -12 48 0 q-6 10 -24 10 q-18 0 -24 -10z" fill="#ff4d4d" opacity=".9"/>
    <!-- 眼睛 -->
    <circle cx="40" cy="44" r="3.2" fill="#fff"/>
    <circle cx="56" cy="44" r="3.2" fill="#fff"/>
    <circle cx="40" cy="44" r="1.5" fill="#2a1020"/>
    <circle cx="56" cy="44" r="1.5" fill="#2a1020"/>
    <!-- 鼻子 -->
    <ellipse cx="48" cy="57" rx="7" ry="5" fill="#ff9dc0"/>
    <ellipse cx="45.4" cy="57" rx="1.3" ry="1.9" fill="#d9648f"/>
    <ellipse cx="50.6" cy="57" rx="1.3" ry="1.9" fill="#d9648f"/>
    <!-- 腮红 -->
    <ellipse cx="32" cy="53" rx="3.4" ry="2" fill="#ff6fa8" opacity=".45"/>
    <ellipse cx="64" cy="53" rx="3.4" ry="2" fill="#ff6fa8" opacity=".45"/>
