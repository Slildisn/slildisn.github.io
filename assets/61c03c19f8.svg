    <path d="M30 66 q18 -8 36 0 l6 24 q-24 8 -48 0z" fill="url(#cape)" opacity=".9"/>
    <!-- 耳朵 -->
    <path d="M28 30 q-2 -14 10 -10 q6 2 6 10z" fill="#ff9dc0"/>
    <path d="M68 30 q2 -14 -10 -10 q-6 2 -6 10z" fill="#ff9dc0"/>
