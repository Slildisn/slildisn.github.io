      <stop offset="0%" stop-color="#ffe4ef"/>
      <stop offset="65%" stop-color="#ffc2d8"/>
      <stop offset="100%" stop-color="#ff9dc0"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#b3122c"/>
