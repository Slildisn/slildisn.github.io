    <path d="M44 62 q4 4 8 0" fill="none" stroke="#7a3d63" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="35" cy="62" rx="3.6" ry="2.2" fill="#ff7fa8" opacity=".45"/>
    <ellipse cx="61" cy="62" rx="3.6" ry="2.2" fill="#ff7fa8" opacity=".45"/>
