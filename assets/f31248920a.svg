<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="未花">
  <defs>
    <radialGradient id="mbg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#ffd8ea"/>
      <stop offset="65%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#f08bb8"/>
    </radialGradient>
    <radialGradient id="mglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5fb" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff5fb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mclip"><circle cx="48" cy="48" r="46"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#mbg)"/>
  <circle cx="48" cy="42" r="30" fill="url(#mglow)"/>
  <g clip-path="url(#mclip)">
    <!-- 光环 -->
    <ellipse cx="48" cy="24" rx="17" ry="5" fill="none" stroke="#fff8d9" stroke-width="3" opacity=".95"/>
    <ellipse cx="48" cy="24" rx="17" ry="5" fill="none" stroke="#ffe9a0" stroke-width="1" opacity=".8"/>
    <!-- 星芒 -->
    <g fill="#ffffff" opacity=".95">
      <path d="M48 30 l2.2 5.4 5.4 2.2 -5.4 2.2 -2.2 5.4 -2.2 -5.4 -5.4 -2.2 5.4 -2.2z"/>
    </g>
    <g fill="#fff0f7" opacity=".8">
      <path d="M30 44 l1.4 3.4 3.4 1.4 -3.4 1.4 -1.4 3.4 -1.4 -3.4 -3.4 -1.4 3.4 -1.4z"/>
      <path d="M66 52 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2z"/>
    </g>
    <!-- 头发剪影 -->
    <path d="M24 74 q6 -30 24 -30 q18 0 24 30 q-24 10 -48 0z" fill="#ffffff" opacity=".28"/>
