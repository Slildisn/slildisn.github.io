<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="奶龙">
  <defs>
    <radialGradient id="nbg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="62%" stop-color="#ffe98a"/>
      <stop offset="100%" stop-color="#ffd447"/>
    </radialGradient>
    <linearGradient id="nbelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="100%" stop-color="#ffeec2"/>
    </linearGradient>
    <clipPath id="nclip"><circle cx="48" cy="48" r="46"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#nbg)"/>
  <g clip-path="url(#nclip)">
    <!-- 小角 -->
    <path d="M34 30 q-3 -12 6 -12 q5 0 5 8z" fill="#ffb84d"/>
    <path d="M62 30 q3 -12 -6 -12 q-5 0 -5 8z" fill="#ffb84d"/>
    <!-- 身体 -->
    <ellipse cx="48" cy="56" rx="26" ry="24" fill="#fffdf2"/>
    <ellipse cx="48" cy="60" rx="17" ry="15" fill="url(#nbelly)"/>
    <!-- 头 -->
    <ellipse cx="48" cy="42" rx="22" ry="18" fill="#fffdf2"/>
    <!-- 眼睛 -->
    <circle cx="41" cy="41" r="3.2" fill="#3a2a12"/>
    <circle cx="55" cy="41" r="3.2" fill="#3a2a12"/>
    <circle cx="42.2" cy="39.8" r="1.1" fill="#fff"/>
    <circle cx="56.2" cy="39.8" r="1.1" fill="#fff"/>
    <!-- 腮红 -->
    <ellipse cx="34" cy="47" rx="3.4" ry="2.1" fill="#ffb0b0" opacity=".55"/>
    <ellipse cx="62" cy="47" rx="3.4" ry="2.1" fill="#ffb0b0" opacity=".55"/>
    <!-- 嘴 -->
    <path d="M45 50 q3 3 6 0" fill="none" stroke="#3a2a12" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 小短手 -->
    <ellipse cx="26" cy="58" rx="5" ry="6" fill="#fffdf2" transform="rotate(-18 26 58)"/>
    <ellipse cx="70" cy="58" rx="5" ry="6" fill="#fffdf2" transform="rotate(18 70 58)"/>
  </g>
  <circle cx="48" cy="48" r="46" fill="none" stroke="#ffd447" stroke-opacity=".7" stroke-width="1.5"/>
</svg>
