<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="丛雨">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3a1633"/>
      <stop offset="60%" stop-color="#22102a"/>
      <stop offset="100%" stop-color="#120a18"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb8d8"/>
      <stop offset="45%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#7f92b8"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a2036"/>
      <stop offset="100%" stop-color="#c2506e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fb0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff8fb0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="48" cy="48" r="46"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#bg)"/>
  <circle cx="48" cy="48" r="34" fill="url(#glow)"/>

  <g clip-path="url(#clip)">
    <!-- 花瓣 -->
    <ellipse cx="24" cy="26" rx="4" ry="2.2" fill="#ff9ec4" opacity=".55" transform="rotate(-25 24 26)"/>
    <ellipse cx="72" cy="70" rx="3.4" ry="1.9" fill="#ff9ec4" opacity=".45" transform="rotate(30 72 70)"/>
    <ellipse cx="70" cy="24" rx="2.6" ry="1.5" fill="#c9b6ff" opacity=".5" transform="rotate(60 70 24)"/>

    <!-- 刀 -->
    <g transform="rotate(-38 48 48)">
      <!-- 刃 -->
      <path d="M48 12 L52 16 L52 58 L48 62 L44 58 L44 16 Z" fill="url(#blade)"/>
      <!-- 血槽 -->
      <path d="M48 15 L48 58" stroke="#9fb0cc" stroke-width="1" opacity=".7"/>
      <!-- 镡 -->
      <rect x="39" y="62" width="18" height="4.5" rx="2.2" fill="#d9a44a"/>
      <!-- 柄 -->
      <rect x="44.5" y="66.5" width="7" height="18" rx="3" fill="url(#hilt)"/>
      <!-- 柄卷 -->
      <path d="M44.5 71 L51.5 74 M44.5 76 L51.5 79 M44.5 81 L51.5 84" stroke="#ffd9e6" stroke-width="1" opacity=".65"/>
    </g>

    <!-- 高光 -->
    <circle cx="48" cy="30" r="26" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.5"/>
  </g>

  <circle cx="48" cy="48" r="46" fill="none" stroke="#ff9ec4" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
