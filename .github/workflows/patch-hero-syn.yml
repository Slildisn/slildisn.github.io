name: hero synergy patch
on:
  push:
    paths:
      - '.github/workflows/patch-hero-syn.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: python3 .github/hero_syn_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html
          git rm -f .github/hero_syn_patch.py .github/workflows/patch-hero-syn.yml
          git commit -m "feat(game): 新增羁绊「深海方舟」「铁壳军团」，覆盖全部新角色"
          git push
