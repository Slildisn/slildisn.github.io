name: hero buff patch
on:
  push:
    paths:
      - '.github/workflows/patch-hero-buff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: python3 .github/hero_buff_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html
          git rm -f .github/hero_buff_patch.py .github/workflows/patch-hero-buff.yml
          git commit -m "feat(game): 「萝莉」六项数值上调"
          git push
