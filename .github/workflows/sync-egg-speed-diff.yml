name: sync-egg-speed-diff

on:
  push:
    paths:
      - '.github/workflows/sync-egg-speed-diff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch egg-war
        run: |
          python3 - <<'PY'
          import io
          p = 'egg-war/game.html'
          s = io.open(p, encoding='utf-8').read()

          old_waves = """  const WAVES = [
              { normal: 5,  raider: 0, interval: 4.0, prep: PREP_TIME },

              { normal: 7,  raider: 2, gale: 2, grunt: 2, swift: 1,
                interval: 3.6, prep: PREP_TIME },

              { normal: 9,  raider: 4, gale: 3, helmet: 2, venom: 1, militia: 2, zipper: 1, ironclad: 1,
                interval: 3.2, prep: PREP_TIME },

              { normal: 11, raider: 5, gale: 3, helmet: 3, flame: 2, flyer: 2, venom: 2, frenzy: 2, summon: 1, giant: 1,
                brute: 1, runner: 1, bulwark: 1, pyro: 1, wisp: 1, berserk: 1,
                interval: 2.8, prep: PREP_TIME },

              { normal: 8,  raider: 4, gale: 4, helmet: 4, flame: 3, flyer: 3, venom: 2, frenzy: 3, summon: 1, giant: 2,
                bolt: 1, veteran: 1, warlord: 1, tanker: 1, fortress: 1, toxic: 1, sky: 1, colossus: 1, shaman: 1,
                interval: 2.4, prep: PREP_TIME, boss: true }
            ];"""

          new_waves = """  const WAVES = [
              { normal: 6,  raider: 0, interval: 3.6, prep: PREP_TIME },

              { normal: 8,  raider: 3, gale: 2, grunt: 3, swift: 2,
                interval: 3.2, prep: PREP_TIME },

              { normal: 11, raider: 5, gale: 4, helmet: 3, venom: 1, militia: 3, zipper: 1, ironclad: 1,
                interval: 2.9, prep: PREP_TIME },

              { normal: 13, raider: 6, gale: 4, helmet: 4, flame: 3, flyer: 3, venom: 3, frenzy: 3, summon: 1, giant: 1,
                brute: 1, runner: 1, bulwark: 1, pyro: 1, wisp: 1, berserk: 1,
                interval: 2.5, prep: PREP_TIME },

              { normal: 10, raider: 5, gale: 5, helmet: 5, flame: 4, flyer: 4, venom: 2, frenzy: 4, summon: 1, giant: 2,
                bolt: 1, veteran: 1, warlord: 1, tanker: 1, fortress: 1, toxic: 1, sky: 1, colossus: 1, shaman: 1,
                interval: 2.2, prep: PREP_TIME, boss: true }
            ];"""

          anchor = "if (!PLANT_CD[k]) PLANT_CD[k] = UNIT_DEFS[k].plantCd || 10;\n  });\n\n"
          anchor_new = anchor + "  // \u96be\u5ea6\u7cfb\u6570\uff1a\u6574\u4f53\u653e\u5927\u654c\u65b9\u5f3a\u5ea6\uff081 = \u539f\u59cb\u96be\u5ea6\uff09\n" + "  const DIFF = { hp: 1.2, speed: 1.08, basePeck: 1.25 };\n\n"

          pairs = [
              (anchor, anchor_new),
              ("    peckDmg: 12,\n    peckRate: 0.9", "    peckDmg: Math.round(12 * DIFF.basePeck),\n    peckRate: 0.9"),
              ("const PREP_TIME = 15;", "const PREP_TIME = 13;"),
              (old_waves, new_waves),
              ("        hp: t.hp,\n        maxHp: t.hp,", "        hp: Math.round(t.hp * DIFF.hp),\n        maxHp: Math.round(t.hp * DIFF.hp),"),
              ("        speed: t.speed,", "        speed: t.speed * DIFF.speed,"),
              ("this.speedScale = this.speedScale === 1 ? 2 : 1;", "this.speedScale = this.speedScale >= 4 ? 1 : (this.speedScale || 1) + 1;"),
              ("this.showToast(this.speedScale === 2 ? '2 \u500d\u901f' : '\u6062\u590d 1 \u500d\u901f');", "this.showToast(this.speedScale === 1 ? '\u6062\u590d 1 \u500d\u901f' : this.speedScale + ' \u500d\u901f');"),
              ("// 1\u00d7 / 2\u00d7 \u500d\u901f", "// 1\u00d7 / 2\u00d7 / 3\u00d7 / 4\u00d7 \u500d\u901f"),
          ]
          for old, new in pairs:
              c = s.count(old)
              assert c == 1, ('pattern issue', c, old[:40])
              s = s.replace(old, new, 1)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched bytes:', len(s.encode('utf-8')))
          PY
          grep -n "DIFF\|speedScale" egg-war/game.html | head -12

      - name: Commit and push
        run: |
          git config user.name "CYRENE Sync"
          git config user.email "sync@users.noreply.github.com"
          git rm -q .github/workflows/sync-egg-speed-diff.yml
          git add egg-war/game.html
          git commit -m "egg-war: speed 1x-4x + harder"
          git push
