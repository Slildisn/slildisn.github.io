name: hero avatar patch
on:
  push:
    paths:
      - '.github/workflows/patch-hero-avatar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch avatar
        run: |
          mkdir -p assets
          curl -fsSL -o assets/hero-lily.webp "https://aka.doubaocdn.com/s/3vHjKKrofN"
          ls -l assets/hero-lily.webp
      - name: apply patch
        run: python3 .github/hero_img_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html assets/hero-lily.webp
          git rm -f .github/hero_img_patch.py .github/workflows/patch-hero-avatar.yml
          git commit -m "feat(game): 「铃兰」使用真人头像（选人面板 + 场景内圆形裁剪）"
          git push
