name: boss hp patch v2
on:
  push:
    paths:
      - '.github/workflows/patch-boss-hp-v2.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: show file
        run: |
          grep -c "var thp1 = NUM(0) + floor * NUM(1)" game.html
          ls .github
      - name: apply
        run: python3 .github/boss_hp_patch.py
      - name: show diff
        run: git diff --stat
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html
          git rm -f .github/boss_hp_patch.py .github/workflows/patch-boss-hp.yml .github/workflows/patch-boss-hp-v2.yml
          git commit -m "feat(game): 铁墓血量上调 60%（BOSS 层同步）"
          git push
