name: synergy patch
on:
  push:
    paths:
      - '.github/workflows/patch-synergy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: python3 .github/bond_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html
          git rm -f .github/bond_patch.py .github/workflows/patch-synergy.yml
          git commit -m "feat(game): 新增羁绊「凡尘行旅」「异种同盟」，覆盖全部 21 位角色"
          git push
