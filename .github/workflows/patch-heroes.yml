name: hero patch
on:
  push:
    paths:
      - '.github/workflows/patch-heroes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply patch
        run: python3 .github/heroes_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html
          git rm -f .github/heroes_patch.py .github/workflows/patch-heroes.yml
          git commit -m "feat(game): 新增萝莉角色「铃兰」，角色总数 21"
          git push
