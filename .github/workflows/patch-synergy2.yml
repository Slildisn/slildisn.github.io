name: synergy patch 2
on:
  push:
    paths:
      - '.github/workflows/patch-synergy2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: python3 .github/bond2_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html
          git rm -f .github/bond2_patch.py .github/workflows/patch-synergy2.yml
          git commit -m "feat(game): 再加4组羁绊（铁壁/疾影/火力/星轨），每个角色至少多入两组"
          git push
