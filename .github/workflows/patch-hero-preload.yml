name: hero preload patch
on:
  push:
    paths:
      - '.github/workflows/patch-hero-preload.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: python3 .github/preload_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add game.html
          git rm -f .github/preload_patch.py .github/workflows/patch-hero-preload.yml
          git commit -m "fix(game): 头像预加载，取消开局 emoji 闪替代"
          git push
